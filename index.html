:root {
  --bg:          #fdf9f6;
  --surface:     rgba(255,255,255,0.36);
  --card:        rgba(255,255,255,0.52);
  --card2:       rgba(247,243,240,0.72);
  --border:      rgba(28,27,26,0.08);
  --border-glass:rgba(255,255,255,0.64);
  --accent:      #1a1a1a;
  --accent-bright:#a65d50;
  --accent-dim:  rgba(28,27,26,0.08);
  --gold:        #7d8c7a;
  --gold-bright: #95a693;
  --gold-dim:    rgba(125,140,122,.12);
  --coral:       #a65d50;
  --coral-dim:   rgba(166,93,80,.12);
  --mist:        #a5b8a2;
  --mist-dim:    rgba(165,184,162,.10);
  --text:        #1c1b1a;
  --sub:         #5d5a56;
  --sub2:        #8c8782;
  --font-ui:     'Epilogue', sans-serif;
  --font-body:   'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
  --font-zh:     'Noto Serif SC', serif;
  --font-zh-sans:'Noto Sans SC', sans-serif;
  --font-brush:  'Ma Shan Zheng', 'Noto Serif SC', serif;
  --radius-pill: 9999px;
  --radius-card: 32px;
  --radius-md:   18px;
  --glass-blur:  26px;
  --shadow-lift: 0 20px 50px rgba(26,26,26,0.05);
  --shadow-float:0 30px 60px rgba(0,0,0,0.08);
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
@keyframes aurora {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

html {
  height:100%;
  background-color: var(--bg);
  background-image:
    radial-gradient(circle, rgba(28,27,26,0.055) 1px, transparent 1.1px),
    linear-gradient(180deg, #fffcfa 0%, #fdf9f6 100%);
  background-size: 20px 20px, auto;
  background-position: 0 0, center;
}
body { height:100%; background:transparent; color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }
#root { height:100%; position:relative; z-index:1; }
button { font-family:var(--font-ui); }
input  { font-family:var(--font-ui); }
textarea { font-family:var(--font-ui); }
button, input, textarea { -webkit-tap-highlight-color:transparent; }
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(28,27,26,0.12); border-radius:2px; }
::selection { background:var(--accent-dim); }

@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
@keyframes blink  { 0%,100%{opacity:.3} 50%{opacity:1} }

/* ── INPUT / TEXTAREA — recessed glass ─── */
input, textarea, select {
  background: rgba(255,255,255,0.38) !important;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1.5px solid rgba(255,255,255,0.55) !important;
  border-top-color: rgba(255,255,255,0.30) !important;
  border-left-color: rgba(255,255,255,0.30) !important;
  box-shadow: inset 1px 2px 6px rgba(28,27,26,0.04);
  border-radius: 16px !important;
  transition: border-color .18s, box-shadow .18s;
}
input:focus, textarea:focus, select:focus {
  outline: none !important;
  border-color: rgba(28,27,26,0.22) !important;
  box-shadow: inset 1px 2px 6px rgba(28,27,26,0.04), 0 0 0 3px rgba(28,27,26,0.06) !important;
}

/* ── INK WASH ATMOSPHERE ───────────────────── */
#ambient-blobs {
  position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
}
#ambient-blobs::before {
  content:''; position:absolute; top:-8%; left:-4%;
  width:65%; height:62%;
  background: radial-gradient(ellipse at 38% 44%, rgba(28,27,26,0.030), transparent 60%);
  filter:blur(36px);
  opacity:.7;
}

.app {
  display:flex;
  height:calc(100dvh - 28px);
  min-height:calc(100vh - 28px);
  margin:14px;
  overflow:hidden;
  position:relative;
  z-index:1;
  border:1px solid rgba(255,255,255,0.42);
  border-radius:26px;
  background:
    radial-gradient(ellipse at 20% 16%, rgba(255,255,255,0.72) 0%, transparent 52%),
    linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.06) 100%);
  box-shadow:0 18px 48px rgba(26,26,26,0.04), inset 0 1px 0 rgba(255,255,255,0.60);
}

/* ── GLASS CARD ─────────────────────────────── */
.glass-card {
  background:rgba(255,255,255,0.44);
  backdrop-filter:blur(var(--glass-blur));
  -webkit-backdrop-filter:blur(var(--glass-blur));
  border:1px solid var(--border-glass);
  border-top-color:rgba(255,255,255,0.82);
  border-left-color:rgba(255,255,255,0.82);
  box-shadow:
    inset 1px 1px 0 rgba(255,255,255,0.50),
    0 20px 50px rgba(26,26,26,0.05);
  border-radius: var(--radius-card);
}

/* ── SIDEBAR — removed; orbital bottom nav used on all viewports ── */
.sidebar { display:none !important; }

/* ── MAIN ─────────────────────────────────── */
.main {
  flex:1; overflow-y:auto;
  position:relative;
  z-index:1;
  padding:28px 20px calc(108px + env(safe-area-inset-bottom));
  max-width:1320px;
  width:100%;
  margin:0 auto;
  min-width:0;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
@media(min-width:760px){
  .main { padding:34px 30px calc(100px + env(safe-area-inset-bottom)); max-width:1320px; }
}
@media(min-width:1100px){
  .main { padding:36px 36px calc(100px + env(safe-area-inset-bottom)); max-width:1320px; }
}

/* ── ORBITAL BOTTOM NAV (all viewports) ───── */
.bnav::-webkit-scrollbar { display:none; }
.bnav {
  display:block;
  position:fixed;
  bottom:max(14px, env(safe-area-inset-bottom));
  left:50%; transform:translateX(-50%);
  width:max-content;
  max-width:calc(100vw - 20px);
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  background:rgba(255,255,255,0.72);
  backdrop-filter:blur(var(--glass-blur));
  -webkit-backdrop-filter:blur(var(--glass-blur));
  border:1px solid rgba(255,255,255,0.72);
  border-top-color:rgba(255,255,255,0.90);
  border-left-color:rgba(255,255,255,0.90);
  border-radius:var(--radius-pill);
  padding:8px 10px;
  z-index:100;
  box-shadow:
    inset 1px 1px 0 rgba(255,255,255,0.55),
    0 20px 50px rgba(26,26,26,0.06);
}
.bnav-inner { display:flex; align-items:center; gap:4px; }
.bnav-item {
  display:flex; flex-direction:column; align-items:center; gap:4px;
  min-width:58px; min-height:54px; justify-content:center;
  padding:8px 11px; cursor:pointer; color:var(--sub);
  font-size:10px; font-weight:700;
  font-family:var(--font-ui);
  letter-spacing:0.08em;
  border-radius:var(--radius-pill);
  transition:all .18s ease;
  position:relative;
  user-select:none;
  text-transform:uppercase;
}
.bnav-item:hover { background:rgba(28,27,26,0.05); color:var(--text); }
.bnav-item.active {
  background:var(--accent);
  color:#fff;
  box-shadow:0 10px 24px rgba(26,26,26,0.18);
}
.bnav-item .icon { font-size:18px; line-height:1; }
.bnav-item .sub { font-size:9px; letter-spacing:0.04em; text-transform:none; opacity:.72; }
.bnav-badge {
  position:absolute; top:4px; right:6px;
  background:var(--coral); color:white;
  font-size:9px; font-weight:700; width:14px; height:14px;
  border-radius:99px; display:grid; place-items:center;
}
@media(max-width:430px){
  .bnav-item { min-width:50px; padding:6px 7px; font-size:9px; }
  .bnav-item .icon { font-size:17px; }
  .bnav-item .sub { display:none; }
}

.hub-sheet {
  position:fixed;
  left:50%;
  bottom:calc(max(14px, env(safe-area-inset-bottom)) + 78px);
  transform:translateX(-50%);
  width:min(560px, calc(100vw - 28px));
  background:rgba(255,255,255,0.74);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,0.72);
  border-radius:28px;
  box-shadow:0 30px 60px rgba(0,0,0,0.08);
  padding:16px;
  z-index:101;
  animation:fadeUp .18s ease;
}
.hub-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}
.hub-title {
  font-size:11px;
  font-weight:800;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--sub);
}
.hub-grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}
.hub-tool {
  border:none;
  background:rgba(255,255,255,0.62);
  border-radius:20px;
  padding:14px 10px 13px;
  cursor:pointer;
  box-shadow:inset 1px 1px 0 rgba(255,255,255,0.5);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  color:var(--text);
  transition:all .16s ease;
}
.hub-tool:hover { transform:translateY(-1px); box-shadow:inset 1px 1px 0 rgba(255,255,255,0.5), 0 10px 24px rgba(0,0,0,0.05); }
.hub-tool .icon { font-size:22px; font-family:var(--font-zh); line-height:1; }
.hub-tool .label { font-size:13px; font-weight:800; letter-spacing:0; text-transform:none; font-family:var(--font-body); }
.hub-tool .desc { font-size:11px; color:var(--sub2); line-height:1.35; text-transform:none; text-align:center; }
.wordmark {
  font-family:var(--font-brush);
  font-size:clamp(22px, 2.4vw, 32px);
  font-weight:400;
  letter-spacing:.02em;
  line-height:.95;
  color:var(--text);
  text-shadow:0 10px 24px rgba(28,27,26,0.08);
}
.wordmark-sub {
  font-family:var(--font-ui);
  font-size:10px;
  color:var(--sub2);
  letter-spacing:.18em;
  margin-top:7px;
  line-height:1;
}
.focus-hanzi {
  font-family:var(--font-brush);
  font-weight:400;
  letter-spacing:0;
  text-shadow:0 22px 48px rgba(28,27,26,0.10);
}
.ink-seal {
  background:rgba(106,21,18,0.96);
  color:#fff;
  font-family:var(--font-zh);
  box-shadow:0 18px 40px rgba(106,21,18,0.18);
}
@media(max-width:760px){
  .hub-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .wordmark { font-size:23px; }
  .wordmark-sub { display:none; }
}

/* ── TWEAKS ───────────────────────────────── */
.tweaks {
  position:fixed; bottom:100px; right:16px;
  background:rgba(255,255,255,0.82);
  backdrop-filter:blur(var(--glass-blur));
  -webkit-backdrop-filter:blur(var(--glass-blur));
  border:1px solid rgba(255,255,255,0.72);
  border-top-color:rgba(255,255,255,0.90);
  border-left-color:rgba(255,255,255,0.90);
  border-radius:28px; padding:20px 18px;
  width:228px; z-index:200;
  box-shadow:
    inset 2px 2px 0 rgba(255,255,255,0.40),
    0 20px 60px rgba(28,27,26,0.10);
  display:none;
}
.tweaks.open { display:block; animation:fadeUp .2s ease; }
.tw-title { font-size:13px; font-weight:700; color:var(--text); margin-bottom:14px; }
.tw-label { font-size:10px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:.08em; margin-bottom:7px; }
.tw-row   { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
.tw-chip  {
  padding:5px 12px; border-radius:var(--radius-pill); font-size:12px; font-weight:500;
  border:1.5px solid rgba(28,27,26,0.10); cursor:pointer; transition:all .15s;
  color:var(--sub); background:rgba(255,255,255,0.55); font-family:var(--font-ui);
}
.tw-chip:hover { border-color:rgba(28,27,26,0.24); color:var(--text); }
.tw-chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
</style></head>

const BUILT_IN_CHAPTERS = [...HSK_CHAPTERS, ...THEME_CHAPTERS];

function normalizeWord(word, chapter) {
  return {
    tones: [],
    tags: [],
    difficulty: chapter.level || 1,
    frequency: 3,
    source: "built-in",
    ...word,
    chapterId: word.chapterId || chapter.id,
    level: word.level || chapter.level || 1,
    chapterTitle: chapter.title,
    chapterEmoji: chapter.emoji,
  };
}

function makeUserChapter(userWords=[]) {
  return {
    id:"user-words", level:0, num:999, title:"내가 추가한 단어", titleZh:"我的词语", emoji:"⭐",
    words:userWords.map((w, i) => ({
      id:w.id || `user-${i}`,
      char:w.char || "",
      pinyin:w.pinyin || "",
      tones:Array.isArray(w.tones) ? w.tones : [],
      meaning:w.meaning || "",
      tags:Array.isArray(w.tags) ? w.tags : ["사용자"],
      example:w.example || "",
      exPinyin:w.exPinyin || "",
      exMeaning:w.exMeaning || "",
      difficulty:Number(w.difficulty || 1),
      frequency:Number(w.frequency || 3),
      source:"user",
    }))
  };
}

function getStudyChapters(stats={}) {
  const userWords = stats.userWords || [];
  const chapters = userWords.length ? [...BUILT_IN_CHAPTERS, makeUserChapter(userWords)] : BUILT_IN_CHAPTERS;
  return chapters.map(ch => ({ ...ch, words: ch.words.map(w => normalizeWord(w, ch)) }));
}

function getAllWords(stats={}) {
  return getStudyChapters(stats).flatMap(ch => ch.words);
}

const HSK_LEVELS = [...new Set(BUILT_IN_CHAPTERS.map(ch => ch.level))].sort((a,b)=>a-b);
const ALL_WORDS = getAllWords();

const StorageService = {
  legacy: { screen:"screen", stats:"stats2", tweaks:"tweaks" },
  get(key, def) {
    try {
      const v = localStorage.getItem(key);
      return v !== null ? JSON.parse(v) : def;
    } catch {
      return def;
    }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  },
  remove(key) {
    try { localStorage.removeItem(key); } catch {}
  },
  migrate() {
    const legacyStats = this.get(this.legacy.stats, null);
    if (legacyStats && !localStorage.getItem(STORE_KEYS.stats)) this.set(STORE_KEYS.stats, legacyStats);
    const legacyScreen = this.get(this.legacy.screen, null);
    if (legacyScreen && !localStorage.getItem(STORE_KEYS.screen)) this.set(STORE_KEYS.screen, legacyScreen);
    const legacyTweaks = this.get(this.legacy.tweaks, null);
    if (legacyTweaks && !localStorage.getItem(STORE_KEYS.tweaks)) this.set(STORE_KEYS.tweaks, legacyTweaks);
  },
  exportPayload(studyState, tweaks) {
    return {
      app:"zh-daily-study",
      schemaVersion:APP_SCHEMA_VERSION,
      exportedAt:new Date().toISOString(),
      studyState,
      tweaks,
    };
  }
};

StorageService.migrate();

};

const todayKey = () => new Date().toISOString().slice(0,10);
const dateKeyAfter = (days) => {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
};
const wordKey = (word, chapterId=word.chapterId) => `${chapterId}:${word.char}`;
const formatDateTime = (iso) => {
  if (!iso) return "아직 없음";
  try {
    return new Date(iso).toLocaleString("ko-KR", {
      month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"
    });
  } catch {
    return iso;
  }
};

function makeDefaultStats() {
  return {
    streak:0, totalLearned:0, totalCorrect:0, totalAnswered:0,
    sessions:0, studyDays:[], todayCount:0, chapterProgress:{},
    reviewQueue:[], reviewLedger:{}, learnedKeys:{}, favorites:{words:{}, phrases:{}},
    bookmarks:{words:{}, phrases:{}}, userWords:[], totalXP:0, maxCombo:0,
    missionProgress:{}, nuanceReview:{},
    lastStudiedAt:null,
  };
}

function hydrateStats(raw={}) {
  const stats = { ...makeDefaultStats(), ...raw };
  const lastDay = stats.lastStudiedAt ? String(stats.lastStudiedAt).slice(0,10) : null;
  if (lastDay !== todayKey()) stats.todayCount = 0;
  stats.favorites = {
    words:{...((stats.favorites || {}).words || {})},
    phrases:{...((stats.favorites || {}).phrases || {})},
  };
  stats.bookmarks = {
    words:{...((stats.bookmarks || {}).words || {})},
    phrases:{...((stats.bookmarks || {}).phrases || {})},
  };
  stats.missionProgress = { ...((stats.missionProgress || {})) };
  stats.nuanceReview = { ...((stats.nuanceReview || {})) };
  return stats;
}

function getSupabaseConfig() {
  return {
    ...SUPABASE_DEFAULT_CONFIG,
    ...StorageService.get(SUPABASE_CONFIG_KEY, {}),
  };
}

function setSupabaseConfig(config) {
  const rawUrl = String(config.url || "").trim();
  const normalizedUrl = rawUrl
    .replace(/\/rest\/v1\/?$/i, "")
    .replace(/\/+$/,"");
  StorageService.set(SUPABASE_CONFIG_KEY, {
    url:normalizedUrl,
    anonKey:String(config.anonKey || "").trim(),
  });
}

function createSupabaseBrowserClient(config) {
  if (!config?.url || !config?.anonKey || !window.supabase?.createClient) return null;
  try {
    return window.supabase.createClient(config.url, config.anonKey, {
      auth: {
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true,
        flowType:'implicit',
      },
    });
  } catch {
    return null;
  }
}

async function pullCloudSnapshot(client, userId) {
  if (!client || !userId) return { data:null, error:new Error("NO_CLIENT") };
  const { data, error } = await client
    .from("study_snapshots")
    .select("user_id, data, updated_at")
    .eq("user_id", userId)
    .maybeSingle();
  return { data, error };
}

async function pushCloudSnapshot(client, userId, studyState, tweaks) {
  if (!client || !userId) return { error:new Error("NO_CLIENT") };
  const payload = {
    app:"zh-daily-study",
    schemaVersion:APP_SCHEMA_VERSION,
    syncedAt:new Date().toISOString(),
    studyState,
    tweaks,
  };
  return client
    .from("study_snapshots")
    .upsert({ user_id:userId, data:payload, updated_at:new Date().toISOString() }, { onConflict:"user_id" })
    .select("updated_at")
    .single();
}

function getDueReviewKeys(stats={}) {
  const today = todayKey();
  const ledger = stats.reviewLedger || {};
  const fromLedger = Object.entries(ledger)
    .filter(([,item]) => item.due <= today || item.wrongStreak > 0)
    .map(([key]) => key);
  return [...new Set([...(stats.reviewQueue || []), ...fromLedger])];
}

function getDueReviewWords(stats={}) {
  const keys = getDueReviewKeys(stats);
  const byKey = new Map(getAllWords(stats).map(w => [wordKey(w), w]));
  return keys
    .map(key => byKey.get(key))
    .filter(Boolean)
    .sort((a,b) => {
      const la = (stats.reviewLedger || {})[wordKey(a)] || {};
      const lb = (stats.reviewLedger || {})[wordKey(b)] || {};
      return (lb.wrong || 0) - (la.wrong || 0) || String(la.due || "").localeCompare(String(lb.due || ""));
    });
}

function recordAnswer(prevStats, ok, word, chapterId, earned=10) {
  const s = { ...makeDefaultStats(), ...prevStats };
  const today = todayKey();
  const studyDays = s.studyDays.includes(today) ? s.studyDays : [...s.studyDays, today];
  const daySet = new Set(studyDays);
  let streak = 0;
  for (let i=0; i<365; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    if (daySet.has(d.toISOString().slice(0,10)) || daySet.has(d.toDateString())) streak++;
    else break;
  }
  const cp = { ...(s.chapterProgress || {}) };
  const learnedKeys = { ...(s.learnedKeys || {}) };
  const key = wordKey(word, chapterId);
  const firstLearn = ok && !learnedKeys[key];
  if (firstLearn) {
    learnedKeys[key] = { firstAt:new Date().toISOString(), chapterId, char:word.char };
    cp[chapterId] = (cp[chapterId] || 0) + 1;
  }

  const reviewLedger = { ...(s.reviewLedger || {}) };
  const old = reviewLedger[key] || { wrong:0, correct:0, interval:0, ease:2.2, wrongStreak:0 };
  const nextInterval = ok ? Math.max(1, Math.round((old.interval || 0) * (old.ease || 2.2)) || 1) : 0;
  reviewLedger[key] = {
    ...old,
    wrong: old.wrong + (ok ? 0 : 1),
    correct: old.correct + (ok ? 1 : 0),
    wrongStreak: ok ? 0 : (old.wrongStreak || 0) + 1,
    interval: nextInterval,
    ease: Math.max(1.3, (old.ease || 2.2) + (ok ? .15 : -.25)),
    lastSeen: today,
    due: ok ? dateKeyAfter(nextInterval) : today,
  };

  const dueKeys = new Set(getDueReviewKeys({ ...s, reviewLedger }));
  if (!ok) dueKeys.add(key);
  if (ok && dueKeys.has(key)) dueKeys.delete(key);

  return {
    ...s,
    totalLearned: Object.keys(learnedKeys).length,
    totalCorrect: (s.totalCorrect || 0) + (ok ? 1 : 0),
    totalAnswered: (s.totalAnswered || 0) + 1,
    totalXP: (s.totalXP || 0) + (ok ? earned : 0),
    todayCount: (s.todayCount || 0) + 1,
    studyDays,
    streak,
    chapterProgress:cp,
    learnedKeys,
    reviewLedger,
    reviewQueue:[...dueKeys],
    sessions:(s.sessions || 0) + ((s.todayCount || 0) === 0 ? 1 : 0),
    lastStudiedAt:new Date().toISOString(),
  };
}

function shuffleArray(items=[]) {
  return [...items].sort(() => Math.random() - .5);
}

function recordMissionCompletion(prevStats, missionId, earned=35) {
  const s = { ...makeDefaultStats(), ...prevStats };
  const missionProgress = { ...(s.missionProgress || {}) };
  const missionEntry = missionProgress[missionId] || {};
  missionProgress[missionId] = {
    clears:(missionEntry.clears || 0) + 1,
    lastClearedAt:new Date().toISOString(),
  };
  return {
    ...s,
    missionProgress,
    totalXP:(s.totalXP || 0) + earned,
    lastStudiedAt:new Date().toISOString(),
  };
}

const speak = (text) => {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.rate = 0.82; u.pitch = 1;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
};

const isFourDigitPin = (pin) => /^\d{4}$/.test(String(pin || ""));

async function derivePinPassword(email, pin) {
  const normalizedEmail = String(email || "").trim().toLowerCase();
  const seed = `jingshi-pin-v1:${normalizedEmail}:${pin}:quiet-study`;
  if (window.crypto?.subtle) {
    const bytes = new TextEncoder().encode(seed);
    const hash = await window.crypto.subtle.digest("SHA-256", bytes);
    const hex = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
    return `Js-${hex}!`;
  }
  return `Js-${btoa(unescape(encodeURIComponent(seed))).replace(/[^a-zA-Z0-9]/g, "").slice(0, 48)}!`;
}

  HSK_CHAPTERS, BUILT_IN_CHAPTERS, THEME_CHAPTERS, ALL_WORDS, HSK_LEVELS,

  makeDefaultStats, hydrateStats, recordAnswer, recordMissionCompletion, shuffleArray, wordKey, todayKey,
  getSupabaseConfig, setSupabaseConfig, createSupabaseBrowserClient,
  pullCloudSnapshot, pushCloudSnapshot, formatDateTime, derivePinPassword, isFourDigitPin
});

<script type="text/babel">
// Shared UI components — exported to window

const TONE_COLORS = ["","#C8993C","#72B882","#A78BFA","#D9624F","#7B9B8E"];
const TONE_LABELS = ["","¹","²","³","⁴","·"];

function ToneBadge({ tone, size=18 }) {
  return (
    <span style={{
      display:"inline-flex", alignItems:"center", justifyContent:"center",
      width:size, height:size, borderRadius:5, fontSize:size*0.65, fontWeight:700, flexShrink:0,
      background: TONE_COLORS[tone] ? TONE_COLORS[tone]+"22" : "var(--card2)",
      color: TONE_COLORS[tone] || "var(--sub)",
      border: `1px solid ${TONE_COLORS[tone] ? TONE_COLORS[tone]+"44" : "var(--border)"}`,
    }}>{TONE_LABELS[tone]||"·"}</span>
  );
}

function PinyinRow({ tones=[] }) {
  return (
    <div style={{display:"flex",gap:4,justifyContent:"center",flexWrap:"wrap"}}>
      {tones.map((t,i) => <ToneBadge key={i} tone={t} size={20}/>)}
    </div>
  );
}

function TTSBtn({ text, size="sm" }) {
  const [playing, setPlaying] = React.useState(false);
  const handleClick = (e) => {
    e.stopPropagation();
    setPlaying(true);
    speak(text);
    setTimeout(() => setPlaying(false), 1200);
  };
  const s = size === "lg"
    ? { width:44, height:44, fontSize:20, borderRadius:12 }
    : { width:32, height:32, fontSize:15, borderRadius:8 };
  return (
    <button onClick={handleClick} style={{
      ...s, display:"grid", placeItems:"center",
      background: playing ? "var(--accent-dim)" : "var(--card2)",
      border: `1px solid ${playing ? "var(--accent)44" : "var(--border)"}`,
      color: playing ? "var(--accent)" : "var(--sub)",
      cursor:"pointer", transition:"all .2s", flexShrink:0,
    }}>
      {playing ? "◉" : "▶"}
    </button>
  );
}

function ProgressBar({ value=0, max=100, color="var(--accent)", height=6 }) {
  const pct = Math.min(100, Math.round((value/max)*100));
  return (
    <div style={{height, background:"var(--card2)", borderRadius:99, overflow:"hidden"}}>
      <div style={{height:"100%", width:`${pct}%`, background:color, borderRadius:99, transition:"width .5s ease"}}/>
    </div>
  );
}

function Chip({ label, active, onClick, color }) {
  return (
    <button onClick={onClick} style={{
      padding:"5px 14px", borderRadius:99, fontSize:13, fontWeight:500,
      border:`1.5px solid ${active ? (color||"var(--accent)") : "var(--border)"}`,
      background: active ? (color||"var(--accent)") : "transparent",
      color: active ? "#fff" : "var(--sub)",
      cursor:"pointer", transition:"all .15s", whiteSpace:"nowrap",
      fontFamily:"var(--font-ui)",
    }}>{label}</button>
  );
}

function Btn({ children, onClick, variant="primary", style={}, disabled=false }) {
  const base = {
    display:"inline-flex", alignItems:"center", justifyContent:"center", gap:8,
    borderRadius:99, fontSize:15, fontWeight:600, cursor:disabled?"not-allowed":"pointer",
    border:"none", fontFamily:"var(--font-ui)", transition:"all .18s",
    opacity: disabled ? .5 : 1,
  };
  const variants = {
    primary: { background:"linear-gradient(135deg,#4f55ae,#8e94f2)", color:"#fff", padding:"13px 28px", boxShadow:"0 6px 24px rgba(79,85,174,0.36), 0 2px 8px rgba(79,85,174,0.20)" },
    ghost:   { background:"rgba(255,255,255,0.55)", backdropFilter:"blur(40px)", WebkitBackdropFilter:"blur(40px)", border:"1.5px solid rgba(255,255,255,0.70)", color:"var(--text)", padding:"11px 22px", boxShadow:"inset 1px 1px 0 rgba(255,255,255,0.50),0 4px 20px rgba(79,85,174,0.10)" },
    danger:  { background:"var(--coral-dim)", color:"var(--coral)", padding:"11px 22px", border:"1.5px solid rgba(186,26,26,0.20)" },
    success: { background:"var(--accent-dim)", color:"var(--accent)", padding:"11px 22px", border:"1.5px solid rgba(79,85,174,0.22)" },
  };
  return (
    <button onClick={disabled ? undefined : onClick}
      style={{...base, ...variants[variant], ...style}}>
      {children}
    </button>
  );
}

function EmptyState({ icon, title, sub }) {
  return (
    <div style={{textAlign:"center", padding:"56px 24px", color:"var(--sub)"}}>
      <div style={{fontSize:48, marginBottom:14}}>{icon}</div>

}

function SectionTitle({ children, sub }) {

    <div style={{marginBottom:18}}>

      </div>
      <div style={{fontSize:24, fontWeight:800, color:"var(--text)", letterSpacing:"0", lineHeight:1.2}}>{children}</div>
      {sub && <div style={{fontSize:13, color:"var(--sub)", marginTop:6, lineHeight:1.6, maxWidth:680}}>{sub}</div>}
    </div>
  );
}

function Card({ children, style={}, onClick }) {
  return (
    <div className="glass-card" onClick={onClick} style={{
      padding:20, ...style,
      cursor: onClick ? "pointer" : "default",
    }}>{children}</div>
  );
}

Object.assign(window, { ToneBadge, PinyinRow, TTSBtn, ProgressBar, Chip, Btn, EmptyState, SectionTitle, Card, TONE_COLORS });

function HomeScreen({ stats, onStartScene, onReview, session, syncStatus, syncState, onToggleWordFavorite }) {
  const chapters = getStudyChapters(stats);
  const allWords = getAllWords(stats);
  const totalWords = allWords.length;
  const learned = stats.totalLearned || 0;
  const pct = totalWords ? Math.round((learned / totalWords) * 100) : 0;
  const reviewWords = getDueReviewWords(stats);
  const reviewCount = reviewWords.length;
  const xp = stats.totalXP || 0;
  const nextChapter = chapters.find(ch => ((stats.chapterProgress||{})[ch.id] || 0) < ch.words.length) || chapters[0];
  const nextChapterProgress = nextChapter ? ((stats.chapterProgress || {})[nextChapter.id] || 0) : 0;
  const nextWord = nextChapter?.words?.[nextChapterProgress] || nextChapter?.words?.[0];
  const focusWord = reviewWords[0] || nextWord || allWords[new Date().getDate() % Math.max(allWords.length, 1)] || {
    char:"学", pinyin:"xué", meaning:"배우다", example:"我学习中文。", exMeaning:"나는 중국어를 공부해요."
  };
  const syncDot = syncState==="error" ? "var(--coral)" : syncState==="synced" ? "var(--gold)" : "var(--sub2)";

  return (
    <div style={{animation:"fadeUp .3s ease both",maxWidth:480,margin:"0 auto"}}>

        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{fontSize:11,color:"var(--sub2)",fontWeight:700}}>{stats.todayCount||0}문항 · {xp}XP</div>
          {session && <div style={{width:7,height:7,borderRadius:"50%",background:syncDot,flexShrink:0}} title={syncStatus}/>}
        </div>
      </div>

      <div className="glass-card" style={{marginBottom:14,padding:"28px 24px 24px",textAlign:"center"}}>

        <div className="focus-hanzi" style={{fontSize:110,lineHeight:.92,color:"var(--text)"}}>{focusWord.char}</div>
        <div style={{fontSize:13,letterSpacing:"0.12em",color:"var(--sub2)",marginTop:14}}>{focusWord.pinyin}</div>
        <div style={{fontSize:20,fontWeight:800,marginTop:4,letterSpacing:"-0.02em"}}>{focusWord.meaning}</div>
        <div style={{display:"flex",justifyContent:"center",marginTop:10}}>

        {focusWord.example && (
          <SentenceInsight
            sentence={focusWord.example}
            pinyin={focusWord.exPinyin}
            meaning={focusWord.exMeaning}
            focusWord={focusWord}
            stats={stats}
            onToggleWordFavorite={onToggleWordFavorite}
          />
        )}
      </div>

      <button onClick={onStartScene} style={{
        width:"100%",padding:"16px",borderRadius:999,border:"none",
        background:"var(--accent)",color:"#fff",fontSize:15,fontWeight:800,
        cursor:"pointer",marginBottom:10,letterSpacing:"0.04em",fontFamily:"var(--font-ui)"
      }}>수련 시작</button>

      {reviewCount > 0 && (
        <button onClick={onReview} style={{
          width:"100%",padding:"13px",borderRadius:999,
          border:"1px solid rgba(166,93,80,0.22)",background:"rgba(166,93,80,0.06)",
          color:"var(--coral)",fontSize:13,fontWeight:800,cursor:"pointer",
          marginBottom:10,letterSpacing:"0.04em",fontFamily:"var(--font-ui)"
        }}>복습 {reviewCount}개 대기 중</button>
      )}

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
        {[
          { label:"진도", value:`${pct}%`, sub:`${learned}/${totalWords}` },
          { label:"오늘", value:`${stats.todayCount||0}`, sub:"문항" },
          { label:"연속", value:`${stats.streak||0}`, sub:"일" },
        ].map(item => (
          <div key={item.label} style={{padding:"14px 10px",borderRadius:20,textAlign:"center",
            background:"rgba(255,255,255,0.44)",border:"1px solid rgba(255,255,255,0.62)"}}>
            <div style={{fontSize:10,color:"var(--sub2)",fontWeight:700,textTransform:"uppercase",letterSpacing:".06em",marginBottom:6}}>{item.label}</div>
            <div style={{fontSize:22,fontWeight:800,lineHeight:1}}>{item.value}</div>
            <div style={{fontSize:10,color:"var(--sub)",marginTop:3}}>{item.sub}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

Object.assign(window, { HomeScreen });

</script>

<script type="text/babel">
// StudyScreen — 3 modes: Flashcard / Listening / Fill-in-blank + XP/combo feedback

function StudyScreen({ chapter, stats, onResult, onBack, onToggleWordFavorite }) {
  const chapters = getStudyChapters(stats);
  const allWords = getAllWords(stats);
  const [mode, setMode] = React.useState("card"); // card | listen | fill
  const [selectedChapter, setSelectedChapter] = React.useState(chapter || chapters[0]);
  const [queue, setQueue] = React.useState([]);
  const [idx, setIdx] = React.useState(0);
  const [sessionDone, setSessionDone] = React.useState(false);
  const [correct, setCorrect] = React.useState(0);
  const [combo, setCombo] = React.useState(0);
  const [xpPop, setXpPop] = React.useState(null); // {xp, key}
  const [flipped, setFlipped] = React.useState(false);
  const [answered, setAnswered] = React.useState(false);
  const [showStroke, setShowStroke] = React.useState(false);
  const [choices, setChoices] = React.useState([]);
  const [selected, setSelected] = React.useState(null);
  const hwRef = React.useRef(null);
  const writerRef = React.useRef(null);

  React.useEffect(() => {
    if (chapter) setSelectedChapter(chapter);
  }, [chapter?.id]);

  // Build queue when chapter or mode changes
  React.useEffect(() => {
    const words = [...selectedChapter.words].sort(() => Math.random() - .5);
    setQueue(words); setIdx(0); setFlipped(false); setAnswered(false);
    setSessionDone(false); setCorrect(0); setCombo(0); setShowStroke(false);
    setSelected(null);
  }, [selectedChapter, mode]);

  // Build choices for quiz modes
  React.useEffect(() => {
    if (!queue[idx]) return;
    const w = queue[idx];
    const pool = allWords.filter(x => x.char !== w.char && x.level === selectedChapter.level);
    const shuffled = [...pool].sort(() => Math.random() - .5).slice(0, 3);
    const opts = [...shuffled.map(x => ({ char: x.char, meaning: x.meaning, correct: false })),
      { char: w.char, meaning: w.meaning, correct: true }].sort(() => Math.random() - .5);
    setChoices(opts);
    setSelected(null); setAnswered(false); setFlipped(false);
    if (mode === "listen") setTimeout(() => speak(w.char), 300);
  }, [idx, queue, mode]);

  // Stroke order
  React.useEffect(() => {
    if (flipped && showStroke && hwRef.current && queue[idx]) {
      const char = queue[idx].char[0];
      hwRef.current.innerHTML = '';
      if (writerRef.current) { try { writerRef.current.cancelAnimation(); } catch{} }
      try {
        writerRef.current = HanziWriter.create(hwRef.current, char, {
          width:130, height:130, padding:8,
          strokeColor:'#5B7EE8', radicalColor:'#E09040',
          outlineColor:'#D8DFF2', showOutline:true,
          strokeAnimationSpeed:1.2, delayBetweenStrokes:60,
        });
        writerRef.current.animateCharacter();
      } catch { hwRef.current.innerHTML = '<div style="color:var(--sub);font-size:12px;padding:16px;text-align:center">데이터 없음</div>'; }
    }
  }, [flipped, showStroke, idx, queue]);

  const word = queue[idx];
  const total = queue.length;
  const progressPct = total ? Math.round(((idx+1) / total) * 100) : 0;
  const modeMeta = {
    card:{ label:"LEARN", sub:"한자를 보고 뜻과 예문까지 천천히 익혀요." },
    listen:{ label:"LISTEN", sub:"소리를 먼저 듣고 떠올리는 감각을 키워요." },
    fill:{ label:"BUILD", sub:"문맥 속에서 단어를 끼워 넣으며 조립해요." },
  };

  const handleAnswer = (ok) => {
    const earned = ok ? (combo >= 2 ? 30 : combo >= 1 ? 20 : 10) : 0;
    const newCombo = ok ? combo + 1 : 0;
    setCombo(newCombo);
    if (ok && earned) setXpPop({ xp: earned, combo: newCombo, key: Date.now() });
    onResult(ok, word, selectedChapter.id, earned);
    setAnswered(true);
    if (ok) setCorrect(c => c+1);
  };

  const next = () => {
    if (idx+1 >= total) { setSessionDone(true); return; }
    setIdx(i => i+1); setFlipped(false); setAnswered(false);
    setShowStroke(false); setSelected(null);
  };

  if (sessionDone) return (
    <div style={{animation:"fadeUp .3s ease",textAlign:"center",padding:"48px 0"}}>
      <div style={{fontSize:52,marginBottom:12}}>{correct===total?"🏆":correct>=total*.7?"🎉":"💪"}</div>
      <div style={{fontFamily:"var(--font-zh)",fontSize:26,color:"var(--accent)",marginBottom:4}}>完成！</div>
      <div style={{fontSize:16,fontWeight:700,color:"var(--text)",marginBottom:4}}>세션 완료</div>
      <div style={{fontSize:14,color:"var(--sub)",marginBottom:8}}>
        {total}개 중 <span style={{color:"var(--accent)",fontWeight:700}}>{correct}개</span> 정답
      </div>
      <div style={{fontSize:13,color:"var(--gold)",fontWeight:600,marginBottom:28}}>
        +{correct*10 + (correct > 2 ? 20 : 0)} XP 획득!
      </div>
      <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
        <Btn variant="ghost" onClick={()=>{setIdx(0);setFlipped(false);setAnswered(false);setSessionDone(false);setCorrect(0);setCombo(0);}}>
          다시 하기
        </Btn>
        <Btn variant="primary" onClick={onBack}>홈으로</Btn>
      </div>
    </div>
  );

  if (!word) return null;

  return (
    <div style={{animation:"fadeUp .3s ease both",position:"relative"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:16,marginBottom:18,flexWrap:"wrap"}}>
        <div>
          <div style={{fontSize:11,fontWeight:800,color:"var(--sub)",letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:6}}>learn</div>
          <div style={{fontSize:26,fontWeight:800,color:"var(--text)",lineHeight:1.2}}>{selectedChapter.title}</div>
          <div style={{fontSize:13,color:"var(--sub)",marginTop:6,lineHeight:1.6,maxWidth:420}}>
            {modeMeta[mode].sub}
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{padding:"10px 14px",borderRadius:999,background:"rgba(255,255,255,0.5)",border:"1px solid rgba(255,255,255,0.62)",fontSize:12,fontWeight:800,color:"var(--sub)"}}>
            학습 흐름 {progressPct}%
          </div>
          <div style={{padding:"10px 14px",borderRadius:16,background:"rgba(166,93,80,0.92)",color:"#fff",fontSize:11,fontWeight:800,letterSpacing:"0.08em"}}>
            {modeMeta[mode].label}
          </div>
        </div>
      </div>

      {/* XP Pop animation */}
      {xpPop && <XpPopup key={xpPop.key} xp={xpPop.xp} combo={xpPop.combo} onDone={()=>setXpPop(null)}/>}

      {/* Chapter selector */}
      <div style={{display:"flex",gap:8,marginBottom:16,overflowX:"auto",paddingBottom:4}}>
        {chapters.map(ch=>(
          <Chip key={ch.id} label={`${ch.emoji} ${ch.title}`}
            active={selectedChapter.id===ch.id} onClick={()=>setSelectedChapter(ch)}/>
        ))}
      </div>

      {/* Mode tabs */}
      <div style={{display:"flex",gap:8,marginBottom:24,background:"rgba(255,255,255,0.35)",padding:6,borderRadius:999,border:"1px solid rgba(255,255,255,0.58)",width:"fit-content",maxWidth:"100%",overflowX:"auto"}}>
        {[["card","학습"],["listen","듣기"],["fill","조립"]].map(([m,l])=>(
          <button key={m} onClick={()=>setMode(m)} style={{
            flex:1,padding:"10px 16px",borderRadius:999,fontSize:12,fontWeight:800,letterSpacing:"0.08em",
            background:mode===m?"var(--accent)":"transparent",
            color:mode===m?"#fff":"var(--sub)",
            border:"none",cursor:"pointer",fontFamily:"var(--font-ui)",
            boxShadow:mode===m?"0 10px 24px rgba(26,26,26,0.14)":"none",
            transition:"all .15s",
            textTransform:"uppercase",
            minWidth:84,
          }}>{l}</button>
        ))}
      </div>

      {/* Progress row */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <span style={{fontSize:12,color:"var(--sub)"}}>{selectedChapter.titleZh} · {idx+1}/{total}</span>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {combo >= 2 && <span style={{fontSize:12,fontWeight:700,color:"var(--gold)"}}>🔥 {combo}연속!</span>}
          <span style={{fontSize:12,fontWeight:700,color:"var(--accent)"}}>✓ {correct}</span>
        </div>
      </div>
      <div style={{height:4,marginBottom:26}}><ProgressBar value={idx+1} max={total || 1} color="var(--accent)"/></div>

      {/* ── CARD MODE ── */}
      {mode==="card" && (
        <>
          <div style={{perspective:1200,width:"100%",maxWidth:400,margin:"0 auto",height:250,cursor:answered?"default":"pointer"}}
            onClick={()=>!answered&&setFlipped(f=>!f)}>
            <div key={`card-${idx}`} style={{
              position:"relative",width:"100%",height:"100%",
              transformStyle:"preserve-3d",transition:"transform .5s cubic-bezier(.4,0,.2,1)",
              transform:flipped?"rotateY(180deg)":"rotateY(0)",
            }}>
              <div style={{position:"absolute",inset:0,backfaceVisibility:"hidden",
                background:"var(--card)",border:"1.5px solid var(--border-glass)",borderRadius:32,
                display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,
                boxShadow:"inset 2px 2px 0 rgba(255,255,255,0.42),0 8px 60px rgba(79,85,174,0.13)"}}>
                <div style={{position:"absolute",top:12,right:14,fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:99,background:"var(--card2)",color:"var(--sub)"}}>HSK {selectedChapter.level}</div>
                <div style={{fontFamily:"var(--font-zh)",fontSize:80,color:"var(--text)",lineHeight:1}}>{word.char}</div>
                <div style={{fontSize:15,color:"var(--accent)",fontWeight:700,letterSpacing:".04em"}}>{word.pinyin}</div>
                <PinyinRow tones={word.tones}/>
                <div style={{position:"absolute",bottom:12,fontSize:11,color:"var(--sub2)"}}>탭하여 뒤집기</div>
              </div>
              <div style={{position:"absolute",inset:0,backfaceVisibility:"hidden",
                transform:"rotateY(180deg)",
                background:"var(--surface)",border:"1.5px solid var(--border-glass)",borderRadius:32,
                display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8,padding:20,
                boxShadow:"inset 2px 2px 0 rgba(255,255,255,0.42),0 8px 60px rgba(79,85,174,0.10)",overflowY:"auto"}}>
                <div style={{position:"absolute",top:12,right:14,fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:99,background:"var(--card2)",color:"var(--sub)"}}>HSK {selectedChapter.level}</div>
                <div style={{fontFamily:"var(--font-zh)",fontSize:44,color:"var(--text)",lineHeight:1}}>{word.char}</div>
                <div style={{fontSize:20,color:"var(--accent)",fontWeight:600}}>{word.pinyin}</div>
                <PinyinRow tones={word.tones}/>
                <div style={{fontSize:16,color:"var(--text)",fontWeight:500}}>{word.meaning}</div>
                <div style={{display:"flex",gap:8,alignItems:"center",marginTop:4}}>
                  <TTSBtn text={word.char} size="lg"/>
                  <button onClick={e=>{e.stopPropagation();setShowStroke(s=>!s);}} style={{
                    padding:"6px 14px",borderRadius:10,fontSize:12,fontWeight:600,
                    background:showStroke?"var(--accent-dim)":"var(--card2)",
                    border:`1px solid ${showStroke?"var(--accent)44":"var(--border)"}`,
                    color:showStroke?"var(--accent)":"var(--sub)",
                    cursor:"pointer",fontFamily:"var(--font-ui)",
                  }}>획순 {showStroke?"▲":"▼"}</button>
                </div>
              </div>
            </div>
          </div>
          {flipped&&showStroke&&(
            <div style={{animation:"fadeUp .25s ease",background:"var(--card)",border:"1px solid var(--border)",borderRadius:14,padding:14,marginTop:10,maxWidth:400,margin:"10px auto 0",display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
              <div style={{fontSize:11,color:"var(--sub)",fontWeight:600,letterSpacing:".05em"}}>획순</div>
              <div ref={hwRef} style={{width:130,height:130}}/>
            </div>
          )}
          {flipped&&word.example&&(
            <div style={{maxWidth:560,margin:"10px auto 0"}}>
              <SentenceInsight
                sentence={word.example}
                pinyin={word.exPinyin}
                meaning={word.exMeaning}
                focusWord={word}
                stats={stats}
                onToggleWordFavorite={onToggleWordFavorite}
              />
            </div>
          )}
          {flipped&&!answered&&(
            <div style={{display:"flex",gap:10,justifyContent:"center",marginTop:18,maxWidth:400,margin:"18px auto 0"}}>
              <button onClick={()=>handleAnswer(false)} style={{flex:1,padding:"13px 0",borderRadius:99,fontSize:15,fontWeight:700,background:"var(--coral-dim)",color:"var(--coral)",border:"1.5px solid rgba(186,26,26,0.25)",cursor:"pointer",fontFamily:"var(--font-ui)"}}>✕ 몰랐어</button>
              <button onClick={()=>handleAnswer(true)} style={{flex:1,padding:"13px 0",borderRadius:99,fontSize:15,fontWeight:700,background:"var(--accent-dim)",color:"var(--accent)",border:"1.5px solid rgba(79,85,174,0.25)",cursor:"pointer",fontFamily:"var(--font-ui)"}}>○ 알았어</button>
            </div>
          )}
          {flipped&&answered&&<div style={{textAlign:"center",marginTop:18,maxWidth:400,margin:"18px auto 0"}}><Btn variant="primary" onClick={next} style={{width:"100%"}}>{idx+1<total?"다음 카드 →":"결과 보기"}</Btn></div>}
          {!flipped&&<div style={{textAlign:"center",marginTop:16}}><Btn variant="ghost" onClick={()=>setFlipped(true)}>뒤집기</Btn></div>}
        </>
      )}

      {/* ── LISTEN MODE ── */}
      {mode==="listen" && (
        <div style={{animation:"fadeUp .25s ease"}}>
          <div style={{background:"var(--card)",border:"1.5px solid var(--border-glass)",borderRadius:32,padding:"28px 20px",marginBottom:16,textAlign:"center",boxShadow:"inset 2px 2px 0 rgba(255,255,255,0.40),0 8px 60px rgba(79,85,174,0.12)"}}>
            <div style={{fontSize:13,color:"var(--sub)",fontWeight:600,marginBottom:18}}>음성을 듣고 맞는 뜻을 고르세요</div>
            <button onClick={()=>speak(word.char)} style={{
              width:72,height:72,borderRadius:"50%",border:"none",cursor:"pointer",
              background:"var(--accent-dim)",color:"var(--accent)",fontSize:30,
              display:"grid",placeItems:"center",margin:"0 auto 12px",
              transition:"all .15s",fontFamily:"var(--font-ui)",
            }} onMouseEnter={e=>e.currentTarget.style.background="var(--accent)33"}
               onMouseLeave={e=>e.currentTarget.style.background="var(--accent-dim)"}>▶</button>
            <div style={{fontSize:12,color:"var(--sub2)"}}>다시 듣기</div>
            {answered&&<div style={{fontFamily:"var(--font-zh)",fontSize:36,color:"var(--text)",marginTop:14,fontWeight:700}}>{word.char}<span style={{fontSize:16,color:"var(--accent)",marginLeft:8}}>{word.pinyin}</span></div>}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {choices.map((c,i)=>{
              const state = !answered?"idle":c.correct?"correct":selected===i?"wrong":"idle";
              return(
                <button key={i} onClick={()=>{if(answered)return;setSelected(i);handleAnswer(c.correct);}} style={{
                  padding:"16px 12px",borderRadius:14,fontSize:14,fontWeight:600,cursor:answered?"default":"pointer",
                  background:state==="correct"?"var(--accent-dim)":state==="wrong"?"var(--coral-dim)":"var(--card)",
                  border:`2px solid ${state==="correct"?"var(--accent)":state==="wrong"?"var(--coral)":"var(--border)"}`,
                  color:state==="correct"?"var(--accent)":state==="wrong"?"var(--coral)":"var(--text)",
                  fontFamily:"var(--font-ui)",transition:"all .15s",textAlign:"center",
                }}>{c.meaning}</button>
              );
            })}
          </div>
          {answered&&word.example&&(
            <div style={{maxWidth:560,margin:"14px auto 0"}}>
              <SentenceInsight
                sentence={word.example}
                pinyin={word.exPinyin}
                meaning={word.exMeaning}
                focusWord={word}
                stats={stats}
                onToggleWordFavorite={onToggleWordFavorite}
              />
            </div>
          )}
          {answered&&<div style={{textAlign:"center",marginTop:18}}><Btn variant="primary" onClick={next} style={{width:"100%",maxWidth:400}}>{idx+1<total?"다음 →":"결과 보기"}</Btn></div>}
        </div>
      )}

      {/* ── FILL MODE ── */}
      {mode==="fill" && (
        <div style={{animation:"fadeUp .25s ease"}}>
          <div style={{background:"var(--card)",border:"1.5px solid var(--border-glass)",borderRadius:32,padding:"22px 20px",marginBottom:16,boxShadow:"inset 2px 2px 0 rgba(255,255,255,0.40),0 8px 60px rgba(79,85,174,0.12)"}}>
            <div style={{fontSize:13,color:"var(--sub)",fontWeight:600,marginBottom:14}}>빈칸에 알맞은 단어를 고르세요</div>
            <div style={{fontFamily:"var(--font-zh)",fontSize:20,color:"var(--text)",lineHeight:1.8,letterSpacing:".05em"}}>
              {(() => {
                const parts = word.example.split(word.char);
                if(parts.length < 2) return <span style={{fontFamily:"var(--font-zh)",fontSize:20}}>{word.example}</span>;
                return parts.map((p,i)=>(
                  <React.Fragment key={i}>
                    {p}
                    {i<parts.length-1&&<span style={{
                      display:"inline-block",minWidth:60,borderBottom:"2.5px solid var(--accent)",
                      verticalAlign:"bottom",textAlign:"center",
                      color:"var(--accent)",fontWeight:700,fontSize:18,
                      paddingBottom:2,marginLeft:2,marginRight:2,
                    }}>{answered?word.char:"＿＿"}</span>}
                  </React.Fragment>
                ));
              })()}
            </div>
            <div style={{fontSize:12,color:"var(--sub)",marginTop:10}}>{word.exMeaning}</div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {choices.map((c,i)=>{
              const state = !answered?"idle":c.correct?"correct":selected===i?"wrong":"idle";
              return(
                <button key={i} onClick={()=>{if(answered)return;setSelected(i);handleAnswer(c.correct);}} style={{
                  padding:"16px 12px",borderRadius:14,cursor:answered?"default":"pointer",
                  background:state==="correct"?"var(--accent-dim)":state==="wrong"?"var(--coral-dim)":"var(--card)",
                  border:`2px solid ${state==="correct"?"var(--accent)":state==="wrong"?"var(--coral)":"var(--border)"}`,
                  color:state==="correct"?"var(--accent)":state==="wrong"?"var(--coral)":"var(--text)",
                  fontFamily:"var(--font-zh)",fontSize:22,fontWeight:700,
                  transition:"all .15s",textAlign:"center",
                }}>{c.char}</button>
              );
            })}
          </div>
          {answered&&(
            <div style={{marginTop:14}}>
              <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"10px 14px",marginBottom:12}}>
                <div style={{fontSize:12,color:"var(--accent)",marginBottom:2}}>{word.pinyin}</div>
                <div style={{fontSize:13,color:"var(--sub)"}}>{word.exPinyin}</div>
              </div>
              {word.example&&(
                <SentenceInsight
                  sentence={word.example}
                  pinyin={word.exPinyin}
                  meaning={word.exMeaning}
                  focusWord={word}
                  stats={stats}
                  onToggleWordFavorite={onToggleWordFavorite}
                />
              )}
              <Btn variant="primary" onClick={next} style={{width:"100%"}}>{idx+1<total?"다음 →":"결과 보기"}</Btn>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function XpPopup({ xp, combo, onDone }) {
  React.useEffect(() => { const t = setTimeout(onDone, 1200); return ()=>clearTimeout(t); }, []);
  return (
    <div style={{
      position:"fixed",top:"30%",left:"50%",transform:"translateX(-50%)",
      pointerEvents:"none",zIndex:300,
      animation:"xpFloat 1.2s ease forwards",
      textAlign:"center",
    }}>
      <div style={{fontSize:22,fontWeight:800,color:"var(--gold)",textShadow:"0 2px 8px rgba(0,0,0,.15)"}}>
        +{xp} XP {combo>=3?"🔥🔥":""}
      </div>
      {combo>=2&&<div style={{fontSize:13,fontWeight:700,color:"var(--accent)",marginTop:2}}>{combo}연속!</div>}
      <style>{`@keyframes xpFloat{0%{opacity:0;transform:translateX(-50%) translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-50px)}}`}</style>
    </div>
  );
}

Object.assign(window, { StudyScreen, XpPopup });

</script>

<script type="text/babel">
// VocabScreen — browse all words by chapter

function VocabScreen({ stats, onStudyChapter, onToggleWordFavorite, onAddUserWord }) {
  const [query, setQuery] = React.useState("");
  const [level, setLevel] = React.useState("all");
  const [tag, setTag] = React.useState("all");
  const [difficulty, setDifficulty] = React.useState("all");
  const [onlyFav, setOnlyFav] = React.useState(false);
  const [showAdd, setShowAdd] = React.useState(false);
  const [expanded, setExpanded] = React.useState({});

  const toggle = (id) => setExpanded(e => ({...e, [id]: !e[id]}));
  const chapters = getStudyChapters(stats);
  const allWords = getAllWords(stats);
  const favWords = (stats.favorites && stats.favorites.words) || {};
  const tags = [...new Set(allWords.flatMap(w => w.tags || []))].sort((a,b)=>a.localeCompare(b,"ko"));

  const filtered = chapters
    .filter(ch => level === "all" || ch.level === Number(level))
    .map(ch => ({
      ...ch,
      words: ch.words.filter(w => {
        const q = query.trim().toLowerCase();
        const haystack = [w.char, w.pinyin, w.meaning, w.example, w.exMeaning, ...(w.tags||[])].join(" ").toLowerCase();
        const queryOk = !q || haystack.includes(q);
        const tagOk = tag === "all" || (w.tags || []).includes(tag);
        const difficultyOk = difficulty === "all" || Number(w.difficulty || 1) === Number(difficulty);
        const favOk = !onlyFav || !!favWords[wordKey(w)];
        return queryOk && tagOk && difficultyOk && favOk;
      })
    }))
    .filter(ch => ch.words.length > 0);

  const totalShown = filtered.reduce((a,c) => a + c.words.length, 0);
  const startFilteredStudy = () => {
    const words = filtered.flatMap(ch => ch.words).slice(0, 40);
    if (!words.length) return;
    onStudyChapter({
      id:"search-session",
      level:0,
      title:"검색 결과",
      titleZh:"搜索结果",
      emoji:"🔎",
      words,
    });
  };

  return (
    <div style={{animation:"fadeUp .3s ease both"}}>
      <div style={{display:"flex",justifyContent:"space-between",gap:10,alignItems:"flex-start",marginBottom:4}}>
        <SectionTitle sub={`전체 ${allWords.length}개 · 지금 ${totalShown}개 표시`}>단어장</SectionTitle>
        <Btn variant="success" onClick={()=>setShowAdd(s=>!s)} style={{padding:"9px 13px",fontSize:13,whiteSpace:"nowrap"}}>
          + 단어
        </Btn>
      </div>

      {/* Search */}
      <div style={{position:"relative", marginBottom:14}}>
        <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",fontSize:16,color:"var(--sub)",pointerEvents:"none"}}>🔍</span>
        <input value={query} onChange={e=>setQuery(e.target.value)}
          placeholder="뜻으로 검색 가능 · 한자, 병음, 예문도 함께 검색…"
          style={{
            width:"100%", padding:"10px 14px 10px 38px",
            background:"var(--card)", border:"1.5px solid var(--border)",
            borderRadius:12, fontSize:15, color:"var(--text)",
            outline:"none", fontFamily:"var(--font-ui)",
            transition:"border-color .15s",
          }}
          onFocus={e=>e.target.style.borderColor="var(--accent)"}
          onBlur={e=>e.target.style.borderColor="var(--border)"}
        />
      </div>

      {showAdd && <UserWordForm onAdd={(word)=>{onAddUserWord(word);setShowAdd(false);}} onCancel={()=>setShowAdd(false)}/>}

      {/* Filters */}
      <div style={{display:"flex", gap:8, marginBottom:10, overflowX:"auto", paddingBottom:2}}>
        <Chip label="전체" active={level==="all"} onClick={()=>setLevel("all")}/>
        {[...new Set(chapters.map(ch => ch.level))].sort((a,b)=>a-b).map(l => (
          <Chip key={l} label={l===0 ? "내 단어" : `HSK ${l}`} active={level===String(l)} onClick={()=>setLevel(String(l))}/>
        ))}
      </div>
      <div style={{display:"flex", gap:8, marginBottom:14, overflowX:"auto", paddingBottom:2}}>
        <Chip label="모든 태그" active={tag==="all"} onClick={()=>setTag("all")}/>
        {tags.slice(0,18).map(t => <Chip key={t} label={t} active={tag===t} onClick={()=>setTag(t)} color="var(--gold)"/>)}
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:20,flexWrap:"wrap"}}>
        {[["all","난이도 전체"],["1","쉬움"],["2","보통"],["3","어려움"]].map(([k,l])=>(
          <Chip key={k} label={l} active={difficulty===k} onClick={()=>setDifficulty(k)} color="var(--coral)"/>
        ))}
        <Chip label="즐겨찾기" active={onlyFav} onClick={()=>setOnlyFav(v=>!v)} color="var(--gold)"/>
        <Btn variant="primary" onClick={startFilteredStudy} disabled={totalShown===0}
          style={{padding:"8px 14px",fontSize:13,marginLeft:"auto"}}>
          결과 학습
        </Btn>
      </div>

      {filtered.length === 0 && <EmptyState icon="🔎" title="검색 결과 없음" sub="다른 키워드로 검색해 보세요"/>}

      {filtered.map(ch => {
        const isOpen = expanded[ch.id] !== false; // default open
        const done = (stats.chapterProgress||{})[ch.id]||0;
        return (
          <div key={ch.id} style={{marginBottom:12}}>
            {/* Chapter header */}
            <div onClick={()=>toggle(ch.id)} style={{
              display:"flex", alignItems:"center", gap:12,
              background:"var(--card)", border:"1px solid var(--border)",
              borderRadius: isOpen ? "14px 14px 0 0" : 14,
              padding:"12px 16px", cursor:"pointer",
              transition:"border-radius .2s",
            }}>
              <span style={{fontSize:22}}>{ch.emoji}</span>
              <div style={{flex:1}}>
                <div style={{display:"flex", alignItems:"center", gap:8}}>
                  <span style={{fontSize:14,fontWeight:700,color:"var(--text)"}}>{ch.title}</span>
                  <span style={{fontSize:11,color:"var(--sub2)",fontFamily:"var(--font-zh)"}}>{ch.titleZh}</span>
                  <span style={{fontSize:11,padding:"2px 8px",borderRadius:99,background:"var(--card2)",color:"var(--sub)"}}>HSK {ch.level}</span>
                </div>
                <div style={{fontSize:11,color:"var(--sub)",marginTop:2}}>{done}/{ch.words.length} 학습완료</div>
              </div>
              <button onClick={(e)=>{e.stopPropagation();onStudyChapter(ch);}} style={{
                border:"none",borderRadius:9,padding:"7px 10px",fontSize:12,fontWeight:700,
                background:"var(--accent-dim)",color:"var(--accent)",cursor:"pointer",fontFamily:"var(--font-ui)",
              }}>학습</button>
              <span style={{color:"var(--sub)", fontSize:18, transition:"transform .2s", transform: isOpen?"rotate(180deg)":"rotate(0)"}}>›</span>
            </div>

            {/* Words list */}
            {isOpen && (
              <div style={{
                background:"var(--surface)", border:"1px solid var(--border)",
                borderTop:"none", borderRadius:"0 0 14px 14px", overflow:"hidden",
              }}>
                {ch.words.map((w,i) => (
                  <div key={i} style={{
                    display:"flex", alignItems:"center", gap:14,
                    padding:"11px 16px",
                    borderBottom: i < ch.words.length-1 ? "1px solid var(--border)" : "none",
                  }}>
                    <div style={{
                      fontFamily:"var(--font-zh)", fontSize:28,
                      color:"var(--text)", minWidth:42, textAlign:"center",
                    }}>{w.char}</div>
                    <div style={{flex:1, minWidth:0}}>
                      <div style={{fontSize:13, color:"var(--accent)", fontWeight:500, marginBottom:2}}>{w.pinyin}</div>
                      <div style={{fontSize:14, color:"var(--text)"}}>{w.meaning}</div>
                      <div style={{fontSize:11, color:"var(--sub)", marginTop:3, fontFamily:"var(--font-zh)"}}>{w.example}</div>
                    </div>
                    <div style={{display:"flex", flexDirection:"column", gap:4, alignItems:"center"}}>
                      <button onClick={()=>onToggleWordFavorite(w)} title="즐겨찾기" style={{
                        width:32,height:32,borderRadius:8,border:"1px solid var(--border)",cursor:"pointer",
                        background:favWords[wordKey(w)]?"var(--gold-dim)":"var(--card2)",
                        color:favWords[wordKey(w)]?"var(--gold)":"var(--sub)",fontSize:15,
                      }}>{favWords[wordKey(w)]?"★":"☆"}</button>
                      <TTSBtn text={w.char}/>
                      <div style={{display:"flex",gap:2}}>
                        {(w.tones||[]).map((t,ti) => <ToneBadge key={ti} tone={t} size={14}/>)}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function UserWordForm({ onAdd, onCancel }) {
  const [form, setForm] = React.useState({
    char:"", pinyin:"", meaning:"", tags:"사용자", example:"", exPinyin:"", exMeaning:"", difficulty:"1", frequency:"3"
  });
  const update = (key, value) => setForm(f => ({ ...f, [key]:value }));
  const submit = () => {
    if (!form.char.trim() || !form.meaning.trim()) {
      alert("중국어 단어와 뜻은 꼭 입력해 주세요.");
      return;
    }
    onAdd({
      ...form,
      id:`user-${Date.now()}`,
      char:form.char.trim(),
      pinyin:form.pinyin.trim(),
      meaning:form.meaning.trim(),
      tags:form.tags.split(",").map(t=>t.trim()).filter(Boolean),
      difficulty:Number(form.difficulty || 1),
      frequency:Number(form.frequency || 3),
      createdAt:new Date().toISOString(),
    });
  };
  const inputStyle = {
    width:"100%",padding:"10px 12px",borderRadius:10,border:"1.5px solid var(--border)",
    background:"var(--card)",color:"var(--text)",fontSize:14,outline:"none",fontFamily:"var(--font-ui)",
  };
  return (
    <Card style={{marginBottom:16,border:"1.5px solid var(--accent)44"}}>
      <div style={{fontSize:14,fontWeight:800,marginBottom:12}}>내 단어 추가</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <input style={inputStyle} value={form.char} onChange={e=>update("char",e.target.value)} placeholder="중국어"/>
        <input style={inputStyle} value={form.pinyin} onChange={e=>update("pinyin",e.target.value)} placeholder="병음"/>
        <input style={inputStyle} value={form.meaning} onChange={e=>update("meaning",e.target.value)} placeholder="뜻"/>
        <input style={inputStyle} value={form.tags} onChange={e=>update("tags",e.target.value)} placeholder="태그, 쉼표 구분"/>
      </div>
      <textarea style={{...inputStyle,minHeight:74,resize:"vertical",marginBottom:10}} value={form.example}
        onChange={e=>update("example",e.target.value)} placeholder="예문"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
        <input style={inputStyle} value={form.exPinyin} onChange={e=>update("exPinyin",e.target.value)} placeholder="예문 병음"/>
        <input style={inputStyle} value={form.exMeaning} onChange={e=>update("exMeaning",e.target.value)} placeholder="예문 뜻"/>
      </div>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end",flexWrap:"wrap"}}>
        <Btn variant="ghost" onClick={onCancel} style={{padding:"9px 14px",fontSize:13}}>취소</Btn>
        <Btn variant="primary" onClick={submit} style={{padding:"9px 14px",fontSize:13}}>추가</Btn>
      </div>
    </Card>
  );
}

Object.assign(window, { VocabScreen, UserWordForm });

</script>

<script type="text/babel">
// PhraseScreen — situational conversation cards

// Word-by-word breakdown for a phrase sentence
function PhraseWordBreakdown({ sentence }) {
  const allWords = getAllWords();
  const tokens = window.tokenizeZh ? window.tokenizeZh(sentence, allWords) : [];
  const meaningful = tokens.filter(t => !t.isPunct && t.meaning);
  if (!meaningful.length) return null;

  return (
    <div style={{animation:"fadeUp .25s ease",
      background:"var(--surface)",border:"1px solid var(--border)",
      borderRadius:14,padding:"14px 16px",marginTop:10,
      maxWidth:420,margin:"10px auto 0"}}>
      <div style={{fontSize:11,fontWeight:800,color:"var(--sub)",letterSpacing:".06em",textTransform:"uppercase",marginBottom:10}}>
        단어별 뜻 조립
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,alignItems:"flex-start"}}>
        {tokens.filter(t => !t.isPunct).map((tok, i) => (
          <div key={i} style={{
            display:"flex",flexDirection:"column",alignItems:"center",
            background: tok.meaning ? "var(--card)" : "transparent",
            border: tok.meaning ? "1px solid var(--border)" : "none",
            borderRadius:10,padding: tok.meaning ? "6px 10px" : "0",
            minWidth:36,
          }}>
            <span style={{fontFamily:"var(--font-zh)",fontSize:17,color:"var(--text)",fontWeight:600,lineHeight:1.3}}>{tok.text}</span>
            {tok.meaning && (
              <span style={{fontSize:10,color:"var(--sub)",marginTop:3,textAlign:"center",lineHeight:1.3,maxWidth:64}}>
                {tok.meaning.length > 8 ? tok.meaning.slice(0,7)+"…" : tok.meaning}
              </span>
            )}
          </div>
        ))}
      </div>
      <div style={{marginTop:10,paddingTop:8,borderTop:"1px solid var(--border)",
        fontSize:12,color:"var(--sub2)",lineHeight:1.5}}>
        → {meaningful.map(t=>t.meaning).join(" + ")}
      </div>
    </div>
  );
}

function PhraseScreen({ stats, onTogglePhraseFavorite, onToggleWordFavorite }) {
  const [activeSet, setActiveSet] = React.useState(PHRASE_SETS[0]);
  const [studyMode, setStudyMode] = React.useState(false);
  const [idx, setIdx] = React.useState(0);
  const [showBack, setShowBack] = React.useState(false);
  const [openInfo, setOpenInfo] = React.useState(null);
  const phraseFavs = (stats.favorites && stats.favorites.phrases) || {};

  const phrase = activeSet.phrases[idx];
  const total = activeSet.phrases.length;
  const phraseKey = (set=activeSet, p=phrase) => `${set.id}:${p.char}`;

  const next = () => {
    if (idx+1 >= total) { setStudyMode(false); setIdx(0); setShowBack(false); return; }
    setIdx(i=>i+1); setShowBack(false);
  };
  const prev = () => { if(idx>0){setIdx(i=>i-1);setShowBack(false);} };

  if (studyMode) return (
    <div style={{animation:"fadeUp .3s ease both"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
        <button onClick={()=>{setStudyMode(false);setIdx(0);setShowBack(false);}} style={{
          background:"var(--card2)",border:"1px solid var(--border)",
          borderRadius:10,padding:"6px 14px",fontSize:13,fontWeight:600,
          color:"var(--sub)",cursor:"pointer",fontFamily:"var(--font-ui)",
        }}>← 뒤로</button>
        <div style={{fontSize:15,fontWeight:700}}>{activeSet.emoji} {activeSet.title}</div>
        <div style={{marginLeft:"auto",fontSize:12,color:"var(--sub)"}}>{idx+1}/{total}</div>
      </div>
      <div style={{display:"flex",justifyContent:"center",marginBottom:12}}>
        <button onClick={()=>onTogglePhraseFavorite(activeSet, phrase)} style={{
          border:"1px solid var(--border)",borderRadius:10,padding:"8px 12px",fontSize:13,fontWeight:700,
          background:phraseFavs[phraseKey()]?"var(--gold-dim)":"var(--card)",color:phraseFavs[phraseKey()]?"var(--gold)":"var(--sub)",
          cursor:"pointer",fontFamily:"var(--font-ui)",
        }}>{phraseFavs[phraseKey()]?"★ 즐겨찾기됨":"☆ 표현 즐겨찾기"}</button>
      </div>
      <div style={{height:5,marginBottom:20}}><ProgressBar value={idx} max={total}/></div>

      {/* Phrase card */}
      <div style={{perspective:1200,width:"100%",maxWidth:420,margin:"0 auto",height:230,cursor:"pointer",marginBottom:16}}
        onClick={()=>setShowBack(b=>!b)}>
        <div key={`phrase-${idx}`} style={{
          position:"relative",width:"100%",height:"100%",
          transformStyle:"preserve-3d",
          transition:"transform .45s cubic-bezier(.4,0,.2,1)",
          transform:showBack?"rotateY(180deg)":"rotateY(0)",
        }}>
          {/* Front */}
          <div style={{position:"absolute",inset:0,backfaceVisibility:"hidden",
            background:"rgba(255,255,255,0.55)",backdropFilter:"blur(64px)",WebkitBackdropFilter:"blur(64px)",
            border:"1.5px solid rgba(255,255,255,0.70)",borderTopColor:"rgba(255,255,255,0.88)",borderLeftColor:"rgba(255,255,255,0.88)",
            borderRadius:32,display:"flex",flexDirection:"column",
            alignItems:"center",justifyContent:"center",gap:12,padding:24,
            boxShadow:"inset 2px 2px 0 rgba(255,255,255,0.42),0 8px 60px rgba(79,85,174,0.13)"}}>
            <div style={{position:"absolute",top:12,left:14,fontSize:11,fontWeight:700,
              padding:"3px 10px",borderRadius:99,background:"var(--accent-dim)",color:"var(--accent)"}}>
              {activeSet.emoji} {activeSet.title}
            </div>
            <div style={{fontFamily:"var(--font-zh)",fontSize:22,color:"var(--text)",
              lineHeight:1.6,textAlign:"center",fontWeight:600}}>{phrase.char}</div>
            <div style={{fontSize:12,color:"var(--sub)",textAlign:"center",fontStyle:"italic"}}>상황: {phrase.tip}</div>
            <div style={{position:"absolute",bottom:12,fontSize:11,color:"var(--sub2)"}}>탭하여 뜻 보기</div>
          </div>
          {/* Back */}
          <div style={{position:"absolute",inset:0,backfaceVisibility:"hidden",
            transform:"rotateY(180deg)",
            background:"rgba(246,248,255,0.60)",backdropFilter:"blur(64px)",WebkitBackdropFilter:"blur(64px)",
            border:"1.5px solid rgba(255,255,255,0.70)",borderTopColor:"rgba(255,255,255,0.88)",borderLeftColor:"rgba(255,255,255,0.88)",
            borderRadius:32,display:"flex",flexDirection:"column",
            alignItems:"center",justifyContent:"center",gap:10,padding:24,
            boxShadow:"inset 2px 2px 0 rgba(255,255,255,0.42),0 8px 60px rgba(79,85,174,0.10)"}}>
            <div style={{fontFamily:"var(--font-zh)",fontSize:18,color:"var(--text)",textAlign:"center",lineHeight:1.6}}>{phrase.char}</div>
            <div style={{fontSize:14,color:"var(--accent)",fontWeight:500,textAlign:"center"}}>{phrase.pinyin}</div>
            <div style={{fontSize:20,fontWeight:700,color:"var(--text)",textAlign:"center"}}>{phrase.meaning}</div>
            <TTSBtn text={phrase.char} size="lg"/>
          </div>
        </div>
      </div>

      {/* Nav buttons */}
      <div style={{display:"flex",gap:10,maxWidth:420,margin:"0 auto"}}>
        <Btn variant="ghost" onClick={prev} style={{flex:1}} disabled={idx===0}>← 이전</Btn>
        <Btn variant="primary" onClick={next} style={{flex:1}}>
          {idx+1<total?"다음 →":"완료 🎉"}
        </Btn>
      </div>

      {/* Tip + Word Breakdown */}
      {showBack && (
        <>
          <div style={{animation:"fadeUp .2s ease",
            background:"var(--card)",border:"1px solid var(--border)",
            borderRadius:14,padding:"12px 16px",marginTop:14,
            maxWidth:420,margin:"14px auto 0",
            display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:18}}>💡</span>
            <div style={{fontSize:13,color:"var(--sub)"}}>
              <strong style={{color:"var(--text)"}}>사용 상황:</strong> {phrase.tip}
            </div>
          </div>

          <SentenceInsight
            sentence={phrase.char}
            pinyin={phrase.pinyin}
            meaning={phrase.meaning}
            stats={stats}
            onToggleWordFavorite={onToggleWordFavorite}
            onTogglePhraseFavorite={onTogglePhraseFavorite}
            phraseSet={activeSet}
            phrase={phrase}
          />
        </>
      )}
    </div>
  );

  // Browse mode
  return (
    <div style={{animation:"fadeUp .3s ease both"}}>
      <SectionTitle sub="실생활에서 바로 쓰는 문장들">상황별 회화</SectionTitle>

      {/* Category cards */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:24}}>
        {PHRASE_SETS.map(set=>(
          <div key={set.id} onClick={()=>{setActiveSet(set);setIdx(0);setShowBack(false);setOpenInfo(null);}}
            style={{
              background:"var(--card)",border:`1.5px solid ${activeSet.id===set.id?"var(--accent)":"var(--border)"}`,
              borderRadius:14,padding:"14px 14px",cursor:"pointer",
              background:activeSet.id===set.id?"var(--accent-dim)":"var(--card)",
              transition:"all .15s",
            }}
            onMouseEnter={e=>{e.currentTarget.style.borderColor="var(--accent)66";}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor=activeSet.id===set.id?"var(--accent)":"var(--border)";}}>
            <div style={{fontSize:24,marginBottom:6}}>{set.emoji}</div>
            <div style={{fontSize:13,fontWeight:700,color:"var(--text)",marginBottom:2}}>{set.title}</div>
            <div style={{fontSize:11,fontFamily:"var(--font-zh)",color:"var(--sub)"}}>{set.titleZh}</div>
            <div style={{fontSize:11,color:"var(--sub2)",marginTop:4}}>{set.phrases.length}개 문장</div>
          </div>
        ))}
      </div>

      {/* Phrase list for selected category */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontSize:15,fontWeight:700,color:"var(--text)"}}>
          {activeSet.emoji} {activeSet.title}
        </div>
        <Btn variant="primary" onClick={()=>setStudyMode(true)} style={{padding:"8px 18px",fontSize:13}}>
          카드로 학습 →
        </Btn>
      </div>

      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,overflow:"hidden"}}>
        {activeSet.phrases.map((p,i)=>(
          <div key={i} style={{
            padding:"13px 16px",
            borderBottom:i<activeSet.phrases.length-1?"1px solid var(--border)":"none",
          }}>
            <div style={{display:"flex",alignItems:"center",gap:14}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontFamily:"var(--font-zh)",fontSize:16,color:"var(--text)",marginBottom:2,lineHeight:1.4}}>{p.char}</div>
                <div style={{fontSize:12,color:"var(--accent)",marginBottom:1}}>{p.pinyin}</div>
                <div style={{fontSize:13,color:"var(--sub)"}}>{p.meaning}</div>
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4,flexShrink:0}}>
                <button onClick={()=>onTogglePhraseFavorite(activeSet, p)} title="즐겨찾기" style={{
                  width:32,height:32,borderRadius:8,border:"1px solid var(--border)",cursor:"pointer",
                  background:phraseFavs[phraseKey(activeSet,p)]?"var(--gold-dim)":"var(--card2)",
                  color:phraseFavs[phraseKey(activeSet,p)]?"var(--gold)":"var(--sub)",fontSize:15,
                }}>{phraseFavs[phraseKey(activeSet,p)]?"★":"☆"}</button>
                <TTSBtn text={p.char}/>
                <button onClick={()=>setOpenInfo(openInfo===i?null:i)} style={{
                  border:"1px solid var(--border)",borderRadius:999,padding:"4px 8px",fontSize:10,fontWeight:800,

}

</script>

<script type="text/babel">
// MissionScreen — blends traditional repetition with scenario-based sentence building

function MissionScreen({ stats, onCompleteMission }) {
  const [activeMission, setActiveMission] = React.useState(MISSION_SETS[0]);
  const [playMode, setPlayMode] = React.useState(false);
  const [stepIdx, setStepIdx] = React.useState(0);

  const [chunkPool, setChunkPool] = React.useState([]);
  const [checked, setChecked] = React.useState(false);
  const [isCorrect, setIsCorrect] = React.useState(false);
  const [revealed, setRevealed] = React.useState(false);
  const missionProgress = stats.missionProgress || {};
  const allWords = getAllWords(stats);
  const activeStep = activeMission.steps[stepIdx];
  const relatedWords = activeMission.wordChars
    .map(char => allWords.find(word => word.char === char))
    .filter(Boolean);
  const relatedGrammar = activeMission.grammarIds
    .map(id => GRAMMAR_NOTES.find(note => note.id === id))
    .filter(Boolean);

  const resetStep = React.useCallback(() => {
    if (!activeStep) return;
    const shuffled = shuffleArray(
      activeStep.chunks.map((label, index) => ({ id:`${activeMission.id}-${stepIdx}-${index}`, label }))
    );
    setChunkPool(shuffled);
    setAssembled([]);
    setChecked(false);
    setIsCorrect(false);
    setRevealed(false);
  }, [activeMission.id, activeStep, stepIdx]);

  React.useEffect(() => {
    resetStep();
  }, [resetStep]);

  const startMission = (mission) => {
    setActiveMission(mission);
    setStepIdx(0);
    setPlayMode(true);
  };

  const sendToAnswer = (id) => {
    if (checked) return;
    const picked = chunkPool.find(chunk => chunk.id === id);
    if (!picked) return;
    setChunkPool(prev => prev.filter(chunk => chunk.id !== id));
    setAssembled(prev => [...prev, picked]);
  };

  const sendBackToPool = (id) => {
    if (checked) return;
    const picked = assembled.find(chunk => chunk.id === id);
    if (!picked) return;
    setAssembled(prev => prev.filter(chunk => chunk.id !== id));

  const answerText = assembled.map(chunk => chunk.label).join("");

            </div>
          </Card>

          <Card style={{padding:"18px 18px 20px"}}>
            <div style={{fontSize:12,fontWeight:800,color:"var(--sub)",letterSpacing:".06em",textTransform:"uppercase",marginBottom:8}}>이번 스텝 힌트</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12}}>

            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {relatedGrammar.map(note => (
                <div key={note.id} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:12}}>

            <div style={{display:"flex",justifyContent:"space-between",gap:12,alignItems:"flex-start"}}>
              <div>
                <div style={{fontSize:15,fontWeight:800,color:isCorrect?"var(--accent)":"var(--coral)",marginBottom:4}}>
                  {isCorrect ? (revealed ? "정답을 확인했어요." : "좋아요, 맞았어요.") : "조금만 더 다듬어 볼까요?"}

      <Card style={{border:"1.5px solid var(--gold)33",background:"var(--gold-dim)"}}>
