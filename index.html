<script type="text/babel">
// GrammarScreen — compact grammar notes for practical conversation

// Grammar key map: which characters to highlight for each grammar note
const GRAMMAR_KEY_MAP = {
  "affirmative-basic": [],
  "negation-bu":       ["不"],
  "negation-mei":      ["没"],
  "questions-ma":      ["吗"],
  "progressive-zai":   ["在","正在"],
  "completed-le":      ["了"],
  "experience-guo":    ["过"],
  "future-yao-hui":    ["要","会"],
  "compare-bijiao":    ["比较","更"],
  "request-qing-keyi": ["请","可以"],
  "ba-structure":      ["把"],
  "bei-passive":       ["被"],
  "shi-de":            ["是","的"],
  "yue-lai-yue":       ["越来越"],
  "yi-jiu":            ["一","就"],
};

// Greedy longest-match tokenizer against ALL_WORDS
function tokenizeZh(text, wordList) {
  const sorted = [...wordList].sort((a,b) => b.char.length - a.char.length);
  const result = [];
  let i = 0;
  while (i < text.length) {
    // Skip punctuation
    if (/[，。！？、：；""''《》【】（）\s]/.test(text[i])) {
        result.push({ text: text[i], meaning: null, pinyin:null, tones:null, word:null, isPunct: true });
      i++; continue;
    }
    let matched = false;
    for (const w of sorted) {
      if (w.char.length > 1 && text.startsWith(w.char, i)) {
        result.push({ text: w.char, meaning: w.meaning, pinyin:w.pinyin, tones:w.tones, word:w, isPunct: false });
        i += w.char.length; matched = true; break;
      }
    }
    if (!matched) {
      // single char — try to find in word list
      const single = sorted.find(w => w.char === text[i]);
      result.push({ text: text[i], meaning: single?.meaning || null, pinyin:single?.pinyin || null, tones:single?.tones || null, word:single || null, isPunct: false });
      i++;
    }
  }
  return result;
}

const TONE_DESCRIPTIONS = {
  1:"1성: 높고 평평하게",
  2:"2성: 위로 올리기",
  3:"3성: 낮게 꺾기",
  4:"4성: 짧게 내리기",
  5:"경성: 가볍게",
};

function detectSentenceGrammar(sentence) {
  const rules = [
    { key:"请", title:"정중한 요청", desc:"请 + 동사: ~해 주세요." },
    { key:"吗", title:"예/아니오 질문", desc:"문장 끝에 吗를 붙이면 질문이 됩니다." },
    { key:"不", title:"부정", desc:"不 + 동사/형용사: ~하지 않다, ~아니다." },
    { key:"没", title:"미완료/부정", desc:"没/没有는 아직 하지 않았거나 없다는 뜻입니다." },
    { key:"在", title:"위치/진행", desc:"在는 '~에 있다' 또는 '~하는 중'을 만듭니다." },
    { key:"了", title:"변화/완료", desc:"了는 일이 일어났거나 상태가 바뀐 느낌을 줍니다." },
    { key:"要", title:"의지/필요", desc:"要는 '~하려고 하다', '~해야 한다', '~을 원하다'에 씁니다." },
    { key:"想", title:"바람", desc:"想 + 동사: ~하고 싶다." },
    { key:"会", title:"가능/미래", desc:"会는 할 줄 안다 또는 앞으로 그럴 것이다의 느낌입니다." },
    { key:"很", title:"정도", desc:"很 + 형용사: 매우/꽤 ~하다. 자연스러운 형용사 문장을 만듭니다." },
    { key:"的", title:"수식/소유", desc:"A 的 B: A의 B, A한 B." },
    { key:"比", title:"비교", desc:"A 比 B + 형용사: A가 B보다 ~하다." },
    { key:"可以", title:"허락/가능", desc:"可以 + 동사: ~할 수 있다, ~해도 된다." },
  ];
  return rules.filter(rule => String(sentence || "").includes(rule.key)).slice(0, 4);
}

function buildSentenceStructure(tokens) {
  const words = tokens.filter(t => !t.isPunct).map(t => t.text);
  if (!words.length) return "문장을 단어 조각으로 나누어 앞에서부터 뜻을 붙이면 흐름이 잡혀요.";
  const hasQuestion = tokens.some(t => t.text === "吗" || t.text === "？" || t.text === "?");
  const hasLe = tokens.some(t => t.text === "了");
  const core = words.length <= 3 ? words.join(" + ") : `${words.slice(0,2).join(" + ")} + ${words.slice(2).join(" + ")}`;
  return `${core}${hasQuestion ? " + 질문 어감" : ""}${hasLe ? " + 완료/변화" : ""}`;
}

function toneSummaryFromTokens(tokens, fallbackPinyin) {
  const toneTokens = tokens.filter(t => !t.isPunct && t.tones && t.tones.length);
  if (toneTokens.length) return toneTokens.slice(0, 6);
  return fallbackPinyin ? [{ text:"문장", pinyin:fallbackPinyin, tones:[] }] : [];
}

function SentenceInsight({
  sentence, pinyin, meaning, focusWord, stats,
  onToggleWordFavorite, onTogglePhraseFavorite, phraseSet, phrase
}) {
  const allWords = React.useMemo(() => getAllWords(stats || {}), [stats]);
  const tokens = React.useMemo(() => tokenizeZh(sentence || "", allWords), [sentence, allWords]);
  const meaningful = tokens.filter(t => !t.isPunct && t.meaning);
  const grammar = detectSentenceGrammar(sentence);
  const favWords = (stats?.favorites && stats.favorites.words) || {};
  const phraseFavs = (stats?.favorites && stats.favorites.phrases) || {};
  const phraseKey = phraseSet && phrase ? `${phraseSet.id}:${phrase.char}` : "";
  const toneTokens = toneSummaryFromTokens(tokens, pinyin);
  const canFavPhrase = !!(onTogglePhraseFavorite && phraseSet && phrase);

  const favButton = (tok) => {
    if (!tok.word || !onToggleWordFavorite) return null;
    const active = !!favWords[wordKey(tok.word)];
    return (
      <button onClick={(e)=>{e.stopPropagation();onToggleWordFavorite(tok.word);}} title="내 단어장에 표시"
        style={{
          width:22,height:22,borderRadius:999,border:"1px solid var(--border)",cursor:"pointer",
          background:active?"var(--gold-dim)":"rgba(255,255,255,0.55)",
          color:active?"var(--gold)":"var(--sub2)",fontSize:12,lineHeight:1,
        }}>{active ? "★" : "☆"}</button>
    );
  };

  return (
    <div style={{
      animation:"fadeUp .25s ease",background:"rgba(255,255,255,0.54)",
      border:"1px solid rgba(28,27,26,0.07)",borderRadius:20,padding:16,
      marginTop:12,boxShadow:"inset 1px 1px 0 rgba(255,255,255,0.45)"
    }}>
      <div style={{display:"flex",justifyContent:"space-between",gap:10,alignItems:"center",marginBottom:10}}>
        <div style={{fontSize:11,fontWeight:900,color:"var(--sub)",letterSpacing:".12em",textTransform:"uppercase"}}>sentence map</div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          {canFavPhrase && (
            <button onClick={()=>onTogglePhraseFavorite(phraseSet, phrase)} style={{
              border:"1px solid var(--border)",borderRadius:999,padding:"5px 9px",fontSize:11,fontWeight:800,
              background:phraseFavs[phraseKey]?"var(--gold-dim)":"rgba(255,255,255,0.55)",
              color:phraseFavs[phraseKey]?"var(--gold)":"var(--sub)",cursor:"pointer",fontFamily:"var(--font-ui)"
            }}>{phraseFavs[phraseKey] ? "★ 표현 저장됨" : "☆ 표현 저장"}</button>
          )}
          <TTSBtn text={sentence}/>
        </div>
      </div>

      <div style={{display:"flex",flexWrap:"wrap",gap:4,alignItems:"baseline",marginBottom:8}}>
        {tokens.map((tok, i) => tok.isPunct ? (
          <span key={i} style={{fontFamily:"var(--font-zh)",fontSize:20,color:"var(--sub2)"}}>{tok.text}</span>
        ) : (
          <button key={i} onClick={()=>tok.word && onToggleWordFavorite?.(tok.word)} disabled={!tok.word || !onToggleWordFavorite}
            style={{
              border:"1px solid rgba(28,27,26,0.06)",borderRadius:12,padding:"5px 7px",
              background:focusWord && tok.text === focusWord.char ? "var(--accent-dim)" : "rgba(255,255,255,0.5)",
              color:"var(--text)",cursor:tok.word && onToggleWordFavorite ? "pointer" : "default",
              fontFamily:"var(--font-zh)",fontSize:20,lineHeight:1.1,
            }}>
            {tok.text}
          </button>
        ))}
      </div>

      <div style={{fontSize:12,color:"var(--accent)",lineHeight:1.5,marginBottom:4}}>{pinyin}</div>
      <div style={{fontSize:13,color:"var(--text)",fontWeight:700,lineHeight:1.5,marginBottom:12}}>{meaning}</div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:10,marginBottom:12}}>
        <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,padding:12}}>

// Render Chinese text with grammar keys highlighted + word tooltip
function GrammarExampleAnnotated({ zh, py, ko, noteId }) {
  const allWords = getAllWords();
  const grammarKeys = GRAMMAR_KEY_MAP[noteId] || [];
  const tokens = tokenizeZh(zh, allWords);
  const [showWords, setShowWords] = React.useState(false);

  // Check if token contains a grammar key
  const isGrammarKey = (text) => grammarKeys.some(k => text === k || text.includes(k));

  return (
    <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:14}}>
      {/* Chinese sentence with highlights */}
      <div style={{display:"flex",justifyContent:"space-between",gap:8,alignItems:"flex-start",marginBottom:6}}>

          {tokens.map((tok, i) => tok.isPunct ? (
            <span key={i} style={{color:"var(--sub2)"}}>{tok.text}</span>
          ) : isGrammarKey(tok.text) ? (
            <span key={i} style={{
              background:"var(--accent)",color:"#fff",borderRadius:5,
              padding:"1px 4px",fontWeight:700,fontSize:19,margin:"0 1px",
            }}>{tok.text}</span>
          ) : (
            <span key={i}>{tok.text}</span>

      </div>
      <div style={{fontSize:12,color:"var(--accent)",marginBottom:4}}>{py}</div>
      <div style={{fontSize:13,color:"var(--sub)",marginBottom:8,lineHeight:1.5}}>{ko}</div>

      {/* Word breakdown toggle */}
      <button onClick={()=>setShowWords(v=>!v)} style={{
        fontSize:11,fontWeight:700,color:"var(--sub)",background:"var(--card2)",

      {showWords && (
        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:8}}>
          {tokens.filter(t=>!t.isPunct && t.meaning).map((tok,i)=>(
            <span key={i} style={{
              display:"inline-flex",flexDirection:"column",alignItems:"center",
              background: isGrammarKey(tok.text) ? "var(--accent-dim)" : "var(--card)",
              border: isGrammarKey(tok.text) ? "1.5px solid var(--accent)55" : "1px solid var(--border)",
              borderRadius:8,padding:"4px 8px",
            }}>
              <span style={{fontFamily:"var(--font-zh)",fontSize:15,color: isGrammarKey(tok.text)?"var(--accent)":"var(--text)",fontWeight:isGrammarKey(tok.text)?700:400}}>{tok.text}</span>
              <span style={{fontSize:10,color:"var(--sub)",marginTop:1}}>{tok.meaning}</span>
              {isGrammarKey(tok.text) && <span style={{fontSize:9,color:"var(--accent)",fontWeight:700}}>★ 문법</span>}
            </span>
          ))}
        </div>
      )}
    </div>
  );
}

<script type="text/babel">
// CommuteScreen — 퇴근길 핸즈프리 듣기 모드

function CommuteScreen({ stats }) {
  const allWords = React.useMemo(() => getAllWords(stats), []);
  const allPhrases = React.useMemo(() =>
    PHRASE_SETS.flatMap(s => s.phrases.map(p => ({
      type:"phrase", char:p.char, pinyin:p.pinyin, meaning:p.meaning, hint:p.tip, setTitle:s.title, setEmoji:s.emoji,
    }))), []);
  const allWordItems = React.useMemo(() =>
    allWords.map(w => ({
      type:"word", char:w.char, pinyin:w.pinyin, meaning:w.meaning, hint:w.chapterTitle, setTitle:w.chapterTitle, setEmoji:w.chapterEmoji||"📖",
    })), [allWords]);

  const [filterType, setFilterType] = React.useState("all"); // all | word | phrase
  const [speed, setSpeed] = React.useState(1.0);
  const [narrationMode, setNarrationMode] = React.useState("full"); // full | zh
  const [playing, setPlaying] = React.useState(false);
  const [idx, setIdx] = React.useState(0);
  const [phase, setPhase] = React.useState("idle"); // idle | zh | ko | done
  const timerRef = React.useRef(null);
  const synthRef = React.useRef(window.speechSynthesis);

  const playlist = React.useMemo(() => {
    let pool = filterType === "word" ? allWordItems
             : filterType === "phrase" ? allPhrases
             : shuffleArray([...allWordItems, ...allPhrases]);
    return filterType === "all" ? pool : shuffleArray(pool);
  }, [filterType, allWordItems, allPhrases]);

  const current = playlist[idx] || null;

  const clearTimer = () => { if (timerRef.current) clearTimeout(timerRef.current); };

  const pauseAfterZh  = () => ({ 0.7: 900, 1.0: 650, 1.5: 420 })[speed] || 650;
  const pauseAfterKo  = () => ({ 0.7: 1500, 1.0: 1100, 1.5: 780 })[speed] || 1100;
  const koRate = () => ({ 0.7: 0.86, 1.0: 0.96, 1.5: 1.12 })[speed] || 0.96;
  const narrationText = (item) => {
    return item.meaning ? String(item.meaning).trim() : "";
  };

  const speakItem = React.useCallback((item) => {
    if (!item || !synthRef.current) return;
    synthRef.current.cancel();
    clearTimer();

    setPhase("zh");
    const uZh = new SpeechSynthesisUtterance(item.char);
    uZh.lang = "zh-CN";
    uZh.rate = speed;
    uZh.onend = () => {
      if (narrationMode === "zh") {
        setPhase("done");
        timerRef.current = setTimeout(() => {
          setIdx(i => (i + 1) % playlist.length);
        }, pauseAfterKo());
        return;
      }
      timerRef.current = setTimeout(() => {
        const koText = narrationText(item);
        if (!koText) {
          setPhase("done");
          setIdx(i => (i + 1) % playlist.length);
          return;
        }
        setPhase("ko");
        const uKo = new SpeechSynthesisUtterance(koText);
        uKo.lang = "ko-KR";
        uKo.rate = koRate();
        uKo.onend = () => {
          setPhase("done");
          timerRef.current = setTimeout(() => {
            setIdx(i => (i + 1) % playlist.length);
          }, pauseAfterKo());
        };
        synthRef.current.speak(uKo);
      }, pauseAfterZh());
    };
    synthRef.current.speak(uZh);
  }, [speed, narrationMode, playlist.length]);

  // Start/stop playback
  React.useEffect(() => {
    if (playing && current) {
      speakItem(current);
    } else if (!playing) {
      synthRef.current.cancel();
      clearTimer();
      setPhase("idle");
    }
    return clearTimer;
  }, [idx, playing]);

  // Cleanup on unmount
  React.useEffect(() => () => { synthRef.current.cancel(); clearTimer(); }, []);

  const handlePlayPause = () => setPlaying(p => !p);
  const handleNext = () => { clearTimer(); synthRef.current.cancel(); setIdx(i=>(i+1)%playlist.length); };
  const handlePrev = () => { clearTimer(); synthRef.current.cancel(); setIdx(i=>(i-1+playlist.length)%playlist.length); };

  const phaseLabel = { idle:"재생 버튼을 눌러 시작하세요", zh:"중국어 듣는 중", ko:"한국어 뜻 듣는 중", done:"다음으로 이동 중" };
  const progress = playlist.length > 0 ? ((idx / playlist.length) * 100).toFixed(1) : 0;

  const speedOptions = [
    { v:0.7, label:"느리게" },
    { v:1.0, label:"보통" },
    { v:1.5, label:"빠르게" },
  ];

  return (
    <div style={{animation:"fadeUp .3s ease both"}}>
      <SectionTitle sub="화면 안 봐도 OK. 중국어를 먼저 듣고, 바로 한국어 뜻만 이어서 들려줘요.">퇴근길 듣기</SectionTitle>

      {/* Filter + Speed */}
      <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
        <div style={{display:"flex",gap:6,background:"var(--card2)",padding:4,borderRadius:12}}>
          {[["all","🔀 섞기"],["word","📖 단어"],["phrase","💬 회화"]].map(([v,l])=>(
            <button key={v} onClick={()=>{setFilterType(v);setIdx(0);setPlaying(false);}} style={{
              padding:"7px 12px",borderRadius:9,fontSize:12,fontWeight:700,border:"none",cursor:"pointer",
              background:filterType===v?"var(--card)":"transparent",
              color:filterType===v?"var(--accent)":"var(--sub)",fontFamily:"var(--font-ui)",
              boxShadow:filterType===v?"0 1px 6px rgba(0,0,0,.06)":"none",transition:"all .15s",
            }}>{l}</button>
          ))}
        </div>
        <div style={{display:"flex",gap:6,background:"var(--card2)",padding:4,borderRadius:12,marginLeft:"auto"}}>
          {speedOptions.map(s=>(
            <button key={s.v} onClick={()=>setSpeed(s.v)} style={{
              padding:"7px 10px",borderRadius:9,fontSize:12,fontWeight:700,border:"none",cursor:"pointer",
              background:speed===s.v?"var(--card)":"transparent",
              color:speed===s.v?"var(--accent)":"var(--sub)",fontFamily:"var(--font-ui)",
              boxShadow:speed===s.v?"0 1px 6px rgba(0,0,0,.06)":"none",transition:"all .15s",
            }}>{s.label}</button>
          ))}
        </div>
      </div>
      <div style={{display:"flex",gap:6,background:"var(--card2)",padding:4,borderRadius:12,marginBottom:16,width:"fit-content",maxWidth:"100%",overflowX:"auto"}}>
        {[
          ["full","중국어 + 한국어 뜻"],
          ["zh","중국어만"],
        ].map(([v,l])=>(
          <button key={v} onClick={()=>{setNarrationMode(v);setPlaying(false);}} style={{
            padding:"8px 12px",borderRadius:9,fontSize:12,fontWeight:800,border:"none",cursor:"pointer",
            background:narrationMode===v?"var(--card)":"transparent",
            color:narrationMode===v?"var(--accent)":"var(--sub)",fontFamily:"var(--font-ui)",
            boxShadow:narrationMode===v?"0 1px 6px rgba(0,0,0,.06)":"none",transition:"all .15s",
          }}>{l}</button>
        ))}
      </div>

      {/* Progress bar */}
      <div style={{height:4,background:"var(--border)",borderRadius:99,marginBottom:18,overflow:"hidden"}}>
        <div style={{height:"100%",width:`${progress}%`,background:"var(--accent)",borderRadius:99,transition:"width .4s"}}/>
      </div>

      {/* Main card */}
      {current && (
        <div style={{
          background:"var(--card)",border:"1.5px solid var(--border-glass)",
          borderRadius:32,padding:"32px 28px",textAlign:"center",
          boxShadow:"var(--shadow-lift)",marginBottom:20,
          minHeight:240,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12,
          position:"relative",
        }}>
          {/* Type badge */}
          <div style={{position:"absolute",top:14,left:16,
            fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:99,
            background: current.type==="phrase" ? "var(--gold-dim)" : "var(--accent-dim)",
            color: current.type==="phrase" ? "var(--gold)" : "var(--accent)",
          }}>{current.type==="phrase"?"💬 회화":"📖 단어"} · {current.setTitle || ""}</div>

          {/* Phase indicator */}
          <div style={{
            fontSize:12,fontWeight:700,letterSpacing:".04em",
            color: phase==="zh"?"var(--accent)":phase==="ko"?"var(--coral)":phase==="done"?"#72B882":"var(--sub)",
            minHeight:18,transition:"color .2s",
          }}>{phaseLabel[phase]}</div>

          {/* Chinese */}
          <div style={{
            fontFamily:"var(--font-zh)",
            fontSize: current.char.length <= 4 ? 72 : current.char.length <= 8 ? 48 : 32,
            color:"var(--text)",lineHeight:1.2,fontWeight:600,
            textShadow: phase==="zh"?"0 0 32px rgba(79,85,174,0.25)":"none",
            transition:"text-shadow .3s",
          }}>{current.char}</div>

          {/* Pinyin */}
          <div style={{fontSize:16,color:"var(--accent)",fontWeight:500,letterSpacing:".02em"}}>{current.pinyin}</div>

          {/* Meaning — revealed after zh phase */}
          <div style={{
            fontSize:20,fontWeight:700,color:"var(--text)",
            opacity: phase==="ko"||phase==="done"||phase==="idle" ? 1 : 0.15,
            transition:"opacity .5s",
            padding:"8px 16px",borderRadius:12,
            background: phase==="ko"||phase==="done" ? "var(--accent-dim)" : "transparent",
          }}>{current.meaning}</div>

          {/* Hint */}
          {current.hint && (
            <div style={{fontSize:12,color:"var(--sub2)",fontStyle:"italic"}}>{current.hint}</div>
          )}

          {/* Index */}
          <div style={{position:"absolute",bottom:14,right:16,fontSize:11,color:"var(--sub2)"}}>
            {idx+1} / {playlist.length}
          </div>
        </div>
      )}

      {/* Controls */}
      <div style={{display:"flex",gap:12,justifyContent:"center",alignItems:"center",marginBottom:20}}>
        <button onClick={handlePrev} style={{
          width:48,height:48,borderRadius:"50%",border:"1.5px solid var(--border)",
          background:"var(--card)",cursor:"pointer",fontSize:18,color:"var(--sub)",
          display:"grid",placeItems:"center",fontFamily:"var(--font-ui)",
        }}>⏮</button>
        <button onClick={handlePlayPause} style={{
          width:72,height:72,borderRadius:"50%",border:"none",cursor:"pointer",
          background: playing ? "var(--accent)" : "var(--accent-dim)",
          color: playing ? "#fff" : "var(--accent)",
          fontSize:28,display:"grid",placeItems:"center",
          boxShadow: playing ? "0 4px 24px rgba(79,85,174,0.35)" : "none",
          transition:"all .2s",
        }}>{playing ? "⏸" : "▶"}</button>
        <button onClick={handleNext} style={{
          width:48,height:48,borderRadius:"50%",border:"1.5px solid var(--border)",
          background:"var(--card)",cursor:"pointer",fontSize:18,color:"var(--sub)",
          display:"grid",placeItems:"center",fontFamily:"var(--font-ui)",
        }}>⏭</button>
      </div>

      {/* Guide */}
      <Card style={{background:"var(--card2)",border:"none"}}>
        <div style={{fontSize:13,fontWeight:700,color:"var(--text)",marginBottom:8}}>이렇게 사용하세요 👟</div>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {[
            "▶ 누르면 자동 재생 — 화면 안 봐도 됩니다",
            "중국어 → 잠시 멈춤 → 뜻 공개 → 다음 순서로 진행돼요",
            "속도·종류(단어/회화/섞기)는 위에서 언제든 바꿀 수 있어요",

<script type="text/babel">
// ReviewScreen — wrong-answer queue

function ReviewScreen({ stats, onResult, onBack }) {
  const [queue, setQueue] = React.useState(() => {
    return getDueReviewWords(stats);
  });
  const [idx, setIdx] = React.useState(0);
  const [flipped, setFlipped] = React.useState(false);
  const [answered, setAnswered] = React.useState(false);
  const [cleared, setCleared] = React.useState(0);
  const [okLast, setOkLast] = React.useState(false);

  if (queue.length === 0) return (
    <div style={{animation:"fadeUp .3s ease both"}}>
      <SectionTitle sub="오늘 만기된 단어와 자주 틀린 단어를 다시 봐요">SRS 복습</SectionTitle>
      <EmptyState icon="🌿" title="복습할 카드가 없어요"
        sub={cleared > 0 ? `${cleared}개 단어를 완전히 익혔어요!` : "학습 중 '몰랐어'를 누르면 여기에 쌓여요"}/>
      <div style={{textAlign:"center", marginTop:24}}>
        <Btn variant="primary" onClick={onBack}>홈으로</Btn>
      </div>
    </div>
  );

  const word = queue[idx];
  const total = queue.length;
  const reviewInfo = (stats.reviewLedger || {})[wordKey(word)] || {};

  const handleAnswer = (ok) => {
    onResult(ok, word, word.chapterId, ok ? 12 : 0);
    if (ok) setCleared(c => c+1);
    setOkLast(ok);
    setAnswered(true);
  };

  const next = () => {
    if (okLast) {
      const nq = queue.filter((_,i) => i !== idx);
      if (nq.length === 0) { setQueue([]); return; }
      setQueue(nq);
      setIdx(i => Math.min(i, nq.length - 1));
    } else {
      setIdx(i => (i+1) % queue.length);
    }
    setFlipped(false); setAnswered(false);
  };

  return (
    <div style={{animation:"fadeUp .3s ease both"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
        <SectionTitle>SRS 복습</SectionTitle>
        <div style={{
          fontSize:13, fontWeight:700, padding:"4px 12px", borderRadius:99,
          background:"var(--coral-dim)", color:"var(--coral)", marginBottom:16,
        }}>{queue.length}개 남음</div>
      </div>

      <div style={{marginBottom:12}}>
        <ProgressBar value={cleared} max={cleared+queue.length} color="var(--coral)"/>
        <div style={{fontSize:11,color:"var(--sub)",marginTop:4,textAlign:"right"}}>{cleared}개 완료</div>
      </div>

      {/* Card */}
      <div style={{perspective:1200, width:"100%", maxWidth:400, margin:"0 auto", height:240, cursor:answered?"default":"pointer"}}
        onClick={()=>!answered&&setFlipped(f=>!f)}>
        <div style={{
          position:"relative", width:"100%", height:"100%",
          transformStyle:"preserve-3d",
          transition:"transform .5s cubic-bezier(.4,0,.2,1)",
          transform: flipped ? "rotateY(180deg)" : "rotateY(0)",
        }}>
          <div style={{
            position:"absolute",inset:0,backfaceVisibility:"hidden",
            background:"rgba(255,255,255,0.55)",backdropFilter:"blur(64px)",WebkitBackdropFilter:"blur(64px)",
            border:"1.5px solid rgba(255,255,255,0.72)",borderTopColor:"rgba(255,255,255,0.88)",borderLeftColor:"rgba(255,255,255,0.88)",
            borderRadius:32,display:"flex",flexDirection:"column",
            alignItems:"center",justifyContent:"center",gap:10,
            boxShadow:"inset 2px 2px 0 rgba(255,255,255,0.42),0 8px 60px rgba(79,85,174,0.13)",
          }}>
            <div style={{
              position:"absolute",top:12,left:14,fontSize:11,fontWeight:700,
              padding:"3px 10px",borderRadius:99,
              background:"var(--coral-dim)",color:"var(--coral)",
            }}>복습 {idx+1}/{total}</div>
            {(reviewInfo.wrong || 0) > 0 && (
              <div style={{
                position:"absolute",top:12,right:14,fontSize:11,fontWeight:700,
                padding:"3px 10px",borderRadius:99,
                background:"var(--gold-dim)",color:"var(--gold)",
              }}>오답 {reviewInfo.wrong}회</div>
            )}
            <div style={{fontFamily:"var(--font-zh)",fontSize:72,color:"var(--text)",lineHeight:1}}>{word.char}</div>
            <PinyinRow tones={word.tones}/>
            <div style={{position:"absolute",bottom:12,fontSize:11,color:"var(--sub2)"}}>탭하여 뒤집기</div>
          </div>
          <div style={{
            position:"absolute",inset:0,backfaceVisibility:"hidden",
            transform:"rotateY(180deg)",
            background:"rgba(246,248,255,0.60)",backdropFilter:"blur(64px)",WebkitBackdropFilter:"blur(64px)",
            border:"1.5px solid rgba(255,255,255,0.70)",borderTopColor:"rgba(255,255,255,0.88)",borderLeftColor:"rgba(255,255,255,0.88)",
            borderRadius:32,display:"flex",flexDirection:"column",
            alignItems:"center",justifyContent:"center",gap:8,padding:20,
            boxShadow:"inset 2px 2px 0 rgba(255,255,255,0.42),0 8px 60px rgba(79,85,174,0.10)",
          }}>
            <div style={{fontFamily:"var(--font-zh)",fontSize:42,color:"var(--text)",lineHeight:1}}>{word.char}</div>
            <div style={{fontSize:19,color:"var(--accent)",fontWeight:600}}>{word.pinyin}</div>
            <div style={{fontSize:15,color:"var(--text)",fontWeight:500}}>{word.meaning}</div>
            <TTSBtn text={word.char} size="lg"/>
          </div>
        </div>
      </div>

      {/* Example */}
      {flipped && (
        <div style={{
          animation:"fadeUp .25s ease",
          background:"var(--card)",border:"1px solid var(--border)",
          borderRadius:14,padding:14,marginTop:12,
          maxWidth:400,margin:"12px auto 0",
        }}>
          <div style={{fontSize:11,color:"var(--sub)",fontWeight:600,marginBottom:6}}>예문</div>
          <div style={{fontFamily:"var(--font-zh)",fontSize:15,color:"var(--text)",marginBottom:2,lineHeight:1.5}}>{word.example}</div>
          <div style={{fontSize:12,color:"var(--accent)",marginBottom:2}}>{word.exPinyin}</div>
          <div style={{fontSize:12,color:"var(--sub)"}}>{word.exMeaning}</div>
        </div>
      )}

      {flipped && !answered && (
        <div style={{animation:"fadeUp .2s ease",display:"flex",gap:12,justifyContent:"center",marginTop:18,maxWidth:400,margin:"18px auto 0"}}>
          <button onClick={()=>handleAnswer(false)} style={{
            flex:1,padding:"13px 0",borderRadius:13,fontSize:15,fontWeight:700,
            background:"var(--coral-dim)",color:"var(--coral)",
            border:"1.5px solid var(--coral)33",cursor:"pointer",fontFamily:"var(--font-ui)",
          }}>✕ 아직 몰라</button>
          <button onClick={()=>handleAnswer(true)} style={{
            flex:1,padding:"13px 0",borderRadius:13,fontSize:15,fontWeight:700,
            background:"var(--accent-dim)",color:"var(--accent)",
            border:"1.5px solid var(--accent)44",cursor:"pointer",fontFamily:"var(--font-ui)",
          }}>○ 이젠 알아!</button>
        </div>
      )}
      {flipped && answered && (
        <div style={{textAlign:"center",marginTop:18,maxWidth:400,margin:"18px auto 0"}}>
          {okLast
            ? <div style={{fontSize:13,color:"var(--accent)",fontWeight:600,marginBottom:12}}>✓ 복습 목록에서 제거돼요</div>
            : <div style={{fontSize:13,color:"var(--coral)",fontWeight:600,marginBottom:12}}>다음에 다시 나와요</div>
          }
          <Btn variant="primary" onClick={next} style={{width:"100%"}}>
            {queue.length <= 1 && okLast ? "완료!" : "다음 →"}
          </Btn>
        </div>
      )}
      {!flipped && (
        <div style={{textAlign:"center",marginTop:16}}>
          <Btn variant="ghost" onClick={()=>setFlipped(true)}>뒤집기</Btn>
        </div>
      )}
    </div>
  );
}

Object.assign(window, { ReviewScreen });

</script>

<script type="text/babel">
// StatsScreen — with XP, level, combo record

function StatsScreen({ stats }) {
  const chapters = getStudyChapters(stats);
  const allWords = getAllWords(stats);
  const total = allWords.length;
  const learned = stats.totalLearned || 0;
  const pct = total > 0 ? Math.round(learned/total*100) : 0;
  const accuracy = stats.totalAnswered > 0 ? Math.round(stats.totalCorrect/stats.totalAnswered*100) : 0;
  const xp = stats.totalXP || 0;
  const level = Math.floor(xp/100)+1;
  const xpInLevel = xp % 100;
  const levelNames = ["","입문","초급","초중급","중급","중상급","상급","고급","전문가","달인","마스터"];

        </div>
        <div style={{flex:1,minWidth:0}}>

          <svg viewBox="0 0 120 120" style={{width:120,height:120,transform:"rotate(-90deg)"}}>
            <circle cx="60" cy="60" r="52" fill="none" stroke="var(--card2)" strokeWidth="10"/>
            <circle cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" strokeWidth="10"
              strokeDasharray={circumference}
              strokeDashoffset={circumference*(1-pct/100)}

      </Card>

      {/* Key stats grid */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
        {[
          {icon:"🔥",val:`${stats.streak||0}일`,lbl:"연속 학습",color:"var(--gold)"},
          {icon:"🎯",val:`${accuracy}%`,lbl:"정확도",color:"var(--accent)"},

        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:5}}>
          {last14.map((d,i)=>(

              aspectRatio:"1",borderRadius:7,display:"grid",placeItems:"center",
              background:d.done?"var(--accent)":"var(--card2)",
              fontSize:10,fontWeight:600,color:d.done?"#fff":"var(--sub2)",
            }}>{d.day}</div>
          ))}
        </div>
        <div style={{display:"flex",gap:12,marginTop:10,fontSize:11,color:"var(--sub)"}}>
          <span><span style={{display:"inline-block",width:10,height:10,background:"var(--accent)",borderRadius:3,marginRight:4,verticalAlign:"middle"}}/>학습함</span>
          <span><span style={{display:"inline-block",width:10,height:10,background:"var(--card2)",borderRadius:3,marginRight:4,verticalAlign:"middle"}}/>미학습</span>
        </div>
      </Card>

      {/* HSK level bars */}
      <Card>
        <div style={{fontSize:11,fontWeight:700,color:"var(--sub)",letterSpacing:".06em",textTransform:"uppercase",marginBottom:14}}>HSK 레벨별 진도</div>
        {[...new Set(chapters.map(ch=>ch.level))].sort((a,b)=>a-b).map(lv=>{

              <ProgressBar value={lvDone} max={lvTotal}
                color={lv===1?"var(--accent)":lv===2?"var(--gold)":"var(--accent-bright)"}/>
            </div>
          );
        })}
      </Card>

      {wrongHotlist.length>0&&(
        <Card style={{marginTop:14}}>
          <div style={{fontSize:11,fontWeight:700,color:"var(--sub)",letterSpacing:".06em",textTransform:"uppercase",marginBottom:12}}>자주 틀린 단어</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {wrongHotlist.map(({word,info})=>(
              <div key={wordKey(word)} style={{display:"flex",alignItems:"center",gap:10}}>

                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,color:"var(--accent)",fontWeight:700}}>{word.pinyin}</div>
                  <div style={{fontSize:13,color:"var(--text)"}}>{word.meaning}</div>

          </div>

      {dueReviews.length>0&&(
        <div style={{marginTop:12,padding:"13px 16px",borderRadius:14,
          background:"var(--coral-dim)",border:"1px solid var(--coral)33",
          display:"flex",alignItems:"center",gap:12}}>

          </div>
        </div>
      )}
    </div>
  );
}

<script type="text/babel">
// ChatScreen — free web handoff. No API keys, no direct AI network calls.

const AI_PROMPT_MODES = [
  { id:"correct", label:"첨삭", hint:"문장 교정", template:(text)=>`다음 중국어 문장을 한국어로 짧고 명확하게 첨삭해줘. 문법 오류, 더 자연스러운 표현, 수정 예문 2개를 보여줘. 문장: ${text}` },
  { id:"conversation", label:"회화", hint:"상황 연습", template:(text)=>`너는 중국 여행 회화 튜터야. 한국어 설명은 짧게 하고, 중국어 회화를 먼저 보여줘. 상황: ${text}. 내 수준은 초급이야.` },
  { id:"compare", label:"차이", hint:"표현 비교", template:(text)=>`${text} 의 차이를 한국어로 쉽게 설명하고 각각 예문 2개씩 보여줘.` },
  { id:"quiz", label:"퀴즈", hint:"복습 문제", template:(text)=>`아래 중국어 표현으로 초급 학습자용 퀴즈 5문제를 만들어줘. 정답과 짧은 해설도 한국어로 붙여줘. 표현: ${text}` },
];

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  document.execCommand("copy");
  document.body.removeChild(ta);
  return Promise.resolve();
}

function ChatScreen() {
  const [mode, setMode] = React.useState("correct");
  const [input, setInput] = React.useState("");
  const [copied, setCopied] = React.useState(false);
  const active = AI_PROMPT_MODES.find(m => m.id === mode) || AI_PROMPT_MODES[0];
  const prompt = active.template(input.trim() || "[여기에 문장이나 상황을 입력하세요]");

  const copyPrompt = async () => {
    await copyText(prompt);
    setCopied(true);
    setTimeout(()=>setCopied(false), 1400);
  };
  const openWeb = async (url) => {
    await copyPrompt();
    window.open(url, "_blank", "noopener,noreferrer");
  };
  const examples = [
    "我昨天去餐厅吃饭，但是我不知道怎么点菜。",

  return (

      <Card style={{marginBottom:14,border:"1.5px solid var(--gold)44",background:"var(--gold-dim)"}}>
        <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
          <span style={{fontSize:24}}>🔗</span>
          <div>
            <div style={{fontSize:14,fontWeight:800,color:"var(--text)",marginBottom:4}}>무료 웹 연결 방식</div>
            <div style={{fontSize:13,color:"var(--sub)",lineHeight:1.55}}>
              자동 로그인이나 자동 전송은 하지 않습니다. 아래 버튼은 프롬프트를 복사하고 외부 서비스를 새 탭으로 열어줍니다.
            </div>
          </div>
        </div>
      </Card>

<script type="text/babel">
// BackupScreen — manual device-to-device handoff using JSON files.

function BackupScreen({
  stats, tweaks, onImport,
  session, syncStatus, syncState, lastSyncedAt, hasSyncConflict,
  onSignOut, onPullCloud, onPushCloud
}) {
  const [status, setStatus] = React.useState("");
  const fileRef = React.useRef(null);
  const username = session?.user?.user_metadata?.display_name || session?.user?.email?.split("@")[0] || "사용자";
  const exportData = () => {
    const payload = StorageService.exportPayload(stats, tweaks);
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `chinese-study-backup-${todayKey()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    setStatus("백업 파일을 만들었어요.");
  };
  const importFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const payload = JSON.parse(reader.result);
        const studyState = payload.studyState || payload.stats || payload;
        const nextStats = { ...makeDefaultStats(), ...studyState };
        onImport(nextStats, payload.tweaks || null);
        setStatus("복원 완료. 이 기기에서 이어서 학습할 수 있어요.");
      } catch (e) {
        setStatus("JSON 파일을 읽지 못했어요. 백업 파일인지 확인해 주세요.");
      }
    };
    reader.readAsText(file, "utf-8");
  };
  return (
    <div style={{animation:"fadeUp .3s ease both"}}>
      <SectionTitle sub="클라우드에 자동 저장돼요. 다른 기기에서도 같은 계정으로 로그인하면 이어서 학습할 수 있어요.">내 계정</SectionTitle>

      {/* ── 현재 사용자 카드 ── */}
      <Card style={{marginBottom:14,border:"1.5px solid var(--accent)44"}}>
        <div style={{display:"flex",justifyContent:"space-between",gap:12,alignItems:"center",marginBottom:16}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:44,height:44,borderRadius:14,background:"var(--accent-dim)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontFamily:"var(--font-brush)",color:"var(--accent)"}}>
              {username[0].toUpperCase()}
            </div>
            <div>
              <div style={{fontSize:16,fontWeight:800,color:"var(--text)"}}>{username}</div>
              <div style={{fontSize:12,color:"var(--sub)",marginTop:2}}>클라우드 계정</div>
            </div>
          </div>
          <Btn variant="ghost" onClick={onSignOut} style={{padding:"7px 12px",fontSize:12}}>로그아웃</Btn>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10,marginBottom:14}}>
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:12}}>
            <div style={{fontSize:11,color:"var(--sub)",fontWeight:800,letterSpacing:".05em",textTransform:"uppercase",marginBottom:4}}>저장 상태</div>
            <div style={{fontSize:13,fontWeight:800,color:hasSyncConflict?"var(--coral)":syncState==="syncing"?"var(--gold)":"var(--accent)"}}>
              {hasSyncConflict?"충돌":syncState==="syncing"?"저장 중":syncState==="error"?"확인 필요":syncState==="dirty"?"대기 중":"자동 저장"}
            </div>
          </div>
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:12}}>
            <div style={{fontSize:11,color:"var(--sub)",fontWeight:800,letterSpacing:".05em",textTransform:"uppercase",marginBottom:4}}>최근 저장</div>
            <div style={{fontSize:13,fontWeight:800,color:"var(--text)"}}>{formatDateTime(lastSyncedAt)}</div>
          </div>
        </div>

        <div style={{borderTop:"1px solid var(--border)",paddingTop:14,display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          <Btn variant="success" onClick={onPullCloud} style={{padding:"9px 13px",fontSize:13}}>클라우드에서 불러오기</Btn>
          <Btn variant="primary" onClick={onPushCloud} style={{padding:"9px 13px",fontSize:13}}>지금 저장</Btn>
          {syncStatus && (
            <div style={{fontSize:12,color:hasSyncConflict?"var(--coral)":"var(--sub)",fontWeight:hasSyncConflict?700:400}}>
              {syncStatus}
            </div>
          )}
        </div>
      </Card>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:10,marginBottom:14}}>
        <Card style={{display:"flex",flexDirection:"column",gap:12}}>
          <div style={{fontSize:24}}>⬇</div>
          <div>
            <div style={{fontSize:15,fontWeight:800,marginBottom:4}}>백업 내보내기</div>
            <div style={{fontSize:12,color:"var(--sub)",lineHeight:1.5}}>진도, 오답노트, 즐겨찾기, 내 단어를 JSON 파일로 저장해요.</div>
          </div>
          <Btn variant="primary" onClick={exportData} style={{width:"100%",marginTop:"auto"}}>JSON 내보내기</Btn>
        </Card>
        <Card style={{display:"flex",flexDirection:"column",gap:12}}>
          <div style={{fontSize:24}}>⬆</div>
          <div>
            <div style={{fontSize:15,fontWeight:800,marginBottom:4}}>백업 불러오기</div>
            <div style={{fontSize:12,color:"var(--sub)",lineHeight:1.5}}>다른 기기에서 만든 JSON 파일을 선택하면 현재 기기에 복원돼요.</div>
          </div>
          <input ref={fileRef} type="file" accept="application/json,.json" style={{display:"none"}} onChange={e=>importFile(e.target.files?.[0])}/>
          <Btn variant="success" onClick={()=>fileRef.current?.click()} style={{width:"100%",marginTop:"auto"}}>JSON 불러오기</Btn>
        </Card>
      </div>

      <Card style={{marginBottom:14,border:"1.5px solid var(--gold)33",background:"var(--gold-dim)"}}>
        <div style={{display:"flex",justifyContent:"space-between",gap:12,alignItems:"center",flexWrap:"wrap"}}>
          <div>
            <div style={{fontSize:14,fontWeight:800,marginBottom:4}}>표현 최종검수 페이지</div>
            <div style={{fontSize:12,color:"var(--sub)",lineHeight:1.6}}>
              회화 문장과 문법 설명 중 애매한 항목만 따로 모아 둔 미니 페이지예요. 선택형으로 체크하고 JSON으로 결과를 넘길 수 있습니다.
            </div>
          </div>
          <Btn variant="ghost" onClick={()=>window.open("./nuance-review.html","_blank","noopener,noreferrer")} style={{padding:"9px 14px",fontSize:13}}>
            검수 페이지 열기
          </Btn>
        </div>
      </Card>

      {status && (
        <div style={{marginBottom:14,padding:"11px 13px",borderRadius:12,background:"var(--accent-dim)",color:"var(--accent)",fontSize:13,fontWeight:700}}>
          {status}
        </div>
      )}

    </div>
  );
}

Object.assign(window, { BackupScreen });

</script>

    current:"편하다, 괜찮다", currentPinyin:"fāngbiàn", currentKo:"짧고 쉽지만 뜻이 넓음",
    proposed:"편리하다, 시간이나 상황이 괜찮다", proposedPinyin:"fāngbiàn", proposedKo:"조금 길지만 오해가 적음",

    proposed:"행동의 완료나 상태 변화를 말할 때 `了`를 자주 씁니다.", proposedPinyin:"", proposedKo:"조금 더 정확함",

  },
  {

    proposed:"가까운 계획·의도는 `要`, 예측이나 능력은 `会`로 자주 말합니다.", proposedPinyin:"", proposedKo:"능력 의미까지 포함",
    question:"학습앱 문장으로 더 자연스럽고 정확한 설명은 어느 쪽인가요?"
  }
];

const CHOICE_LABELS = {
  current:"현재안이 더 좋음",
  proposed:"제안안이 더 좋음",
  both:"둘 다 괜찮음",
  neither:"둘 다 애매함",
};

function InspectScreen({ supabaseClient, supabaseConfig }) {
  const [reviews, setReviews] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const [copiedLink, setCopiedLink] = React.useState(false);
  const [copiedDoc, setCopiedDoc] = React.useState(false);

  const hasSupabase = !!(supabaseConfig?.url && supabaseConfig?.anonKey);

  const loadReviews = React.useCallback(async () => {
    if (!supabaseClient) return;
    setLoading(true);
    const { data } = await supabaseClient
      .from("nuance_reviews")
      .select("reviewer_name,item_id,choice,comment,reviewed_at")
      .order("reviewed_at", { ascending: false });
    if (data) setReviews(data);
    setLoading(false);
  }, [supabaseClient]);

  React.useEffect(() => { loadReviews(); }, [loadReviews]);

  function generateLink() {
    const base = window.location.origin + "/nuance-review";
    const hash = `url=${encodeURIComponent(supabaseConfig.url)}&key=${encodeURIComponent(supabaseConfig.anonKey)}`;
    return `${base}#${hash}`;
  }

  async function copyLink() {
    try {
      await navigator.clipboard.writeText(generateLink());
    } catch {
      const ta = document.createElement("textarea");
      ta.value = generateLink();
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
    }
    setCopiedLink(true);
    setTimeout(() => setCopiedLink(false), 1800);
  }

  function buildMarkdown() {
    const reviewerMap = {};
    reviews.forEach(r => {
      if (!reviewerMap[r.reviewer_name]) reviewerMap[r.reviewer_name] = {};
      reviewerMap[r.reviewer_name][r.item_id] = r;
    });

    const lines = [
      "# 중국어 학습 콘텐츠 검수 결과",
      `생성일: ${new Date().toLocaleDateString("ko-KR")}`,
      `항목 수: ${REVIEW_ITEMS.length}`,
      "",
    ];

    Object.entries(reviewerMap).forEach(([name, rmap]) => {
      lines.push(`## 검수자: ${name}`);
      lines.push("");
      let cat = "";
      REVIEW_ITEMS.forEach((item, i) => {
        if (item.category !== cat) {
          cat = item.category;
          lines.push(`### ${cat}`);
        }
        const r = rmap[item.id];
        const choice = r?.choice ? CHOICE_LABELS[r.choice] : "미선택";
        lines.push(`**${i+1}. ${item.context}**`);
        lines.push(`- 현재안: ${item.current}${item.currentPinyin ? " ("+item.currentPinyin+")" : ""} — ${item.currentKo}`);
        lines.push(`- 제안안: ${item.proposed}${item.proposedPinyin ? " ("+item.proposedPinyin+")" : ""} — ${item.proposedKo}`);
        lines.push(`- 판정: **${choice}**`);
        if (r?.comment) lines.push(`- 코멘트: ${r.comment}`);
        lines.push("");
      });
    });

    if (Object.keys(reviewerMap).length === 0) {
      lines.push("아직 제출된 검수 결과가 없습니다.");
    }
    return lines.join("\n");
  }

  async function exportDoc() {
    const md = buildMarkdown();
    try {
      const blob = new Blob([md], { type:"text/markdown;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `검수결과_${new Date().toISOString().slice(0,10)}.md`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    } catch {
      await navigator.clipboard.writeText(md);
      setCopiedDoc(true);
      setTimeout(() => setCopiedDoc(false), 1800);
    }
  }

  const reviewerMap = {};
  reviews.forEach(r => {
    if (!reviewerMap[r.reviewer_name]) reviewerMap[r.reviewer_name] = {};
    reviewerMap[r.reviewer_name][r.item_id] = r;
  });
  const reviewerNames = Object.keys(reviewerMap);

  const rowStyle = { display:"flex", justifyContent:"space-between", alignItems:"center", padding:"7px 0", borderBottom:"1px solid var(--border)", fontSize:13 };
  const tagStyle = (choice) => ({
    fontSize:11, fontWeight:700, padding:"3px 8px", borderRadius:999,
    background: choice==="current" ? "rgba(79,157,116,.13)" : choice==="proposed" ? "var(--accent-dim)" : choice==="both" ? "rgba(200,180,100,.12)" : choice==="neither" ? "rgba(217,96,74,.11)" : "var(--surface)",
    color: choice==="current" ? "#3a8060" : choice==="proposed" ? "var(--accent)" : choice==="both" ? "#7a6a20" : choice==="neither" ? "var(--coral)" : "var(--sub)",
  });

  return (
    <div style={{animation:"fadeUp .3s ease both"}}>
      <SectionTitle sub="검수 링크를 팀즈로 전달하고, 결과를 Claude 문서로 내보내세요">콘텐츠 검수 관리</SectionTitle>

      {!hasSupabase ? (
        <Card style={{textAlign:"center", padding:"32px 24px", color:"var(--sub)"}}>
          <div style={{fontSize:24, marginBottom:10}}>🔗</div>
          <div style={{fontWeight:700, marginBottom:6}}>Supabase 연결이 필요해요</div>
          <div style={{fontSize:13, lineHeight:1.65}}>동기화 탭에서 Supabase URL과 anon key를 먼저 입력해 주세요.</div>
        </Card>
      ) : (
        <>
          <Card style={{marginBottom:12}}>
            <div style={{fontWeight:800, fontSize:14, marginBottom:4}}>검수 링크</div>
            <div style={{fontSize:12, color:"var(--sub)", marginBottom:12, lineHeight:1.6}}>
              이 링크를 팀즈로 전달하세요. 검수자는 로그인 없이 이름만 입력하면 바로 시작할 수 있어요.
            </div>
            <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
              <button
                onClick={copyLink}
                style={{padding:"10px 18px", borderRadius:12, background:"var(--accent)", color:"#fff",
                  border:"none", cursor:"pointer", fontWeight:700, fontSize:13}}>
                {copiedLink ? "복사됨 ✓" : "검수 링크 복사"}
              </button>
              <button
                onClick={loadReviews}
                style={{padding:"10px 18px", borderRadius:12, background:"var(--surface)", color:"var(--sub)",
                  border:"1px solid var(--border)", cursor:"pointer", fontWeight:700, fontSize:13}}>
                {loading ? "로딩 중…" : "결과 새로고침"}
              </button>
            </div>
          </Card>

          <Card style={{marginBottom:12}}>
            <div style={{fontWeight:800, fontSize:14, marginBottom:12}}>
              검수 현황
              <span style={{marginLeft:8, fontSize:12, fontWeight:400, color:"var(--sub)"}}>
                {reviewerNames.length}명 참여 · 전체 {REVIEW_ITEMS.length}항목
              </span>
            </div>
            {reviewerNames.length === 0 ? (
              <div style={{fontSize:13, color:"var(--sub)", textAlign:"center", padding:"20px 0"}}>
                아직 제출된 검수 결과가 없어요.
              </div>
            ) : reviewerNames.map(name => {
              const rmap = reviewerMap[name];
              const done = REVIEW_ITEMS.filter(it => rmap[it.id]?.choice).length;
              return (
                <div key={name} style={{marginBottom:16}}>

function SceneScreen({ stats, onResult }) {
  const [activeScene, setActiveScene] = React.useState(null);
  const [step, setStep] = React.useState(0);       // 0=intro 1=learn 2=drill 3=done
  const [wordIdx, setWordIdx] = React.useState(0);
  const [drillIdx, setDrillIdx] = React.useState(0);
  const [selected, setSelected] = React.useState(null);
  const [correctCount, setCorrectCount] = React.useState(0);
  const [sessionXP, setSessionXP] = React.useState(0);

  const allWords = React.useMemo(() => getAllWords(stats), [stats]);
  const scenes = React.useMemo(() => THEME_CHAPTERS.concat(HSK_CHAPTERS.slice(0, 8)), []);
  const shuffle = arr => [...arr].sort(() => Math.random() - .5);
  const allDrillOptions = React.useMemo(() => {

    const dw = activeScene.words.slice(0, Math.min(5, activeScene.words.length));
    return dw.map(w => {
      const wrong = allWords.filter(x => x.char !== w.char && x.meaning !== w.meaning);

    });
  }, [activeScene, allWords]);

  const startScene = (scene) => {

          background:"var(--accent)",color:"#fff",fontSize:15,fontWeight:800,
          cursor:"pointer",fontFamily:"var(--font-ui)"

  // Step 1: Learn expressions
  if (step === 1) {
    const w = sceneWords[wordIdx];
    const isLast = wordIdx === sceneWords.length - 1;
    return (
      <div style={{animation:"fadeUp .22s ease both",maxWidth:480,margin:"0 auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>

/* ─── Local account helpers ─── */
function normalizeAccountName(u) {
  return String(u || "").trim().replace(/\s+/g, " ");
}
function hashAccountName(u) {
  let h = 2166136261;
  for (const ch of String(u || "")) {
    h ^= ch.codePointAt(0);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(36);
}
function usernameToFakeEmail(u) {
  const normalized = normalizeAccountName(u).toLowerCase();
  const ascii = normalized
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9_]+/g, "_")
    .replace(/^_+|_+$/g, "")
    .slice(0, 24);
  return `u_${ascii || "user"}_${hashAccountName(normalized)}@jingxi.app`;
}

        <button onClick={()=>handleSubmit()} disabled={loading}
          style={{width:"100%", padding:"14px", borderRadius:999, border:"none",
            background:"var(--accent)", color:"#fff", fontSize:15, fontWeight:800,
            cursor:loading?"not-allowed":"pointer", fontFamily:"var(--font-ui)", opacity:loading?0.72:1}}>
          {loading?"확인 중...":mode==="login"?"들어가기":"만들고 들어가기"}
        </button>
      </div>
    </div>
  );
}

function applyAccent(key) {
  const c = ACCENT_OPTIONS[key] || ACCENT_OPTIONS.periwinkle;
  document.documentElement.style.setProperty("--accent", c.accent);
  document.documentElement.style.setProperty("--accent-bright", c.bright);
  document.documentElement.style.setProperty("--accent-dim", c.dim);
}

function App() {
  const bootstrappedUserRef = React.useRef(null);
  const autoSyncTimerRef = React.useRef(null);
  const suppressNextAutoSyncRef = React.useRef(false);
  const [sessionLoading, setSessionLoading] = React.useState(true);
  const [screen, setScreen] = React.useState("home");
  const [hubOpen, setHubOpen] = React.useState(false);
  const [activeChapter, setActiveChapter] = React.useState(null);
  const [tweaksOpen, setTweaksOpen] = React.useState(false);
  const [tweaks, setTweaks] = React.useState(() => ({...TWEAK_DEFAULTS}));
  const [stats, setStats] = React.useState(() => hydrateStats(makeDefaultStats()));
  const [supabaseConfig, setSupabaseConfigState] = React.useState(() => getSupabaseConfig());
  const [supabaseClient, setSupabaseClient] = React.useState(null);
  const [session, setSession] = React.useState(null);
  const [syncStatus, setSyncStatus] = React.useState("로컬 저장 사용 중");
  const [syncState, setSyncState] = React.useState("local");
  const [lastSyncedAt, setLastSyncedAt] = React.useState(null);
  const [lastRemoteUpdatedAt, setLastRemoteUpdatedAt] = React.useState(null);
  const [hasSyncConflict, setHasSyncConflict] = React.useState(false);

  React.useEffect(() => {
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./sw.js").catch(()=>{});
    }
  }, []);
  React.useEffect(() => { applyAccent(tweaks.accent); }, [tweaks.accent]);
  React.useEffect(() => {
    document.documentElement.style.setProperty(
      "--font-zh", tweaks.zhFont==="sans" ? "'Noto Sans SC',sans-serif" : "'Noto Serif SC',serif"
    );
  }, [tweaks.zhFont]);
  React.useEffect(() => {
    const client = createSupabaseBrowserClient(supabaseConfig);
    setSupabaseClient(client);
    if (!client) {
      setSession(null);
      bootstrappedUserRef.current = null;
      setSyncStatus("");
      setSyncState("local");
      setLastSyncedAt(null);
      setLastRemoteUpdatedAt(null);
      setHasSyncConflict(false);
      setSessionLoading(false);
      return;
    }
    let unsub = null;
    client.auth.getSession().then(({ data }) => {
      setSession(data.session || null);
      setSyncStatus(data.session ? "클라우드 연결됨" : "");
      setSyncState(data.session ? "synced" : "ready");
      if (!data.session) setHasSyncConflict(false);
      setSessionLoading(false);
    });
    const { data } = client.auth.onAuthStateChange((_event, nextSession) => {
      setSession(nextSession || null);
      setSyncStatus(nextSession ? `로그인됨: ${nextSession.user?.email || "사용자"}` : "로그아웃됨");
      setSyncState(nextSession ? "synced" : "ready");
      if (!nextSession) {
        setHasSyncConflict(false);
        setLastSyncedAt(null);
        setLastRemoteUpdatedAt(null);
      }
    });
    unsub = data?.subscription;
    return () => unsub?.unsubscribe?.();
  }, [supabaseConfig.url, supabaseConfig.anonKey]);
  React.useEffect(() => {
    if (!supabaseClient || !session?.user?.id) return;
    if (bootstrappedUserRef.current === session.user.id) return;
    bootstrappedUserRef.current = session.user.id;
    (async () => {
      const { data } = await pullCloudSnapshot(supabaseClient, session.user.id);
      const remoteState = data?.data?.studyState;
      const remoteTweaks = data?.data?.tweaks;
      setLastRemoteUpdatedAt(data?.updated_at || null);
      if (!remoteState) {
        const pushed = await pushCloudSnapshot(supabaseClient, session.user.id, stats, tweaks);
        setSyncStatus("클라우드 초기 저장 완료");
        setSyncState("synced");
        setLastSyncedAt(pushed.data?.updated_at || new Date().toISOString());
        setLastRemoteUpdatedAt(pushed.data?.updated_at || new Date().toISOString());
        return;
      }
      const localStamp = String(stats.lastStudiedAt || "");
      const remoteStamp = String(remoteState.lastStudiedAt || data.updated_at || "");
      if (remoteStamp > localStamp) {
        setStats(hydrateStats(remoteState));
        suppressNextAutoSyncRef.current = true;
        if (remoteTweaks) setTweaks({...TWEAK_DEFAULTS, ...remoteTweaks});
        setSyncStatus("클라우드 최신 데이터를 가져왔어요.");
        setSyncState("synced");
        setLastSyncedAt(data.updated_at || new Date().toISOString());
        setHasSyncConflict(false);
      } else {
        const pushed = await pushCloudSnapshot(supabaseClient, session.user.id, stats, tweaks);
        setSyncStatus("로컬 최신 데이터를 클라우드에 반영했어요.");
        setSyncState("synced");
        setLastSyncedAt(pushed.data?.updated_at || new Date().toISOString());
        setLastRemoteUpdatedAt(pushed.data?.updated_at || new Date().toISOString());
        setHasSyncConflict(false);
      }
    })();
  }, [supabaseClient, session?.user?.id]);

  const applyTweak = (key, val) => {
    const next = {...tweaks, [key]:val};
    setTweaks(next);
  };

  const handleStudyChapter = (ch) => {
    setActiveChapter(ch);
    setScreen("study");
  };

  const handleResult = (ok, word, chapterId, earned=10) => {
    setStats(s => recordAnswer(s, ok, word, chapterId, earned));
  };

  const handleMissionComplete = (missionId, earned=35) => {
    setStats(s => recordMissionCompletion(s, missionId, earned));
    setSyncStatus("미션 완료! 클라우드 저장을 준비하고 있어요.");
    setSyncState("dirty");
  };

  const handleToggleWordFavorite = (word) => {
    setStats(s => {
      const favorites = { words:{...((s.favorites||{}).words||{})}, phrases:{...((s.favorites||{}).phrases||{})} };
      const key = wordKey(word);
      if (favorites.words[key]) delete favorites.words[key];
      else favorites.words[key] = { char:word.char, chapterId:word.chapterId, savedAt:new Date().toISOString() };
      return { ...s, favorites };
    });
  };

  const handleTogglePhraseFavorite = (set, phrase) => {
    setStats(s => {
      const favorites = { words:{...((s.favorites||{}).words||{})}, phrases:{...((s.favorites||{}).phrases||{})} };
      const key = `${set.id}:${phrase.char}`;
      if (favorites.phrases[key]) delete favorites.phrases[key];
      else favorites.phrases[key] = { setId:set.id, char:phrase.char, meaning:phrase.meaning, savedAt:new Date().toISOString() };
      return { ...s, favorites };
    });
  };

  const handleAddUserWord = (word) => {
    setStats(s => ({ ...s, userWords:[...(s.userWords || []), word] }));
  };

  const handleImport = (nextStats, nextTweaks) => {
    setStats(hydrateStats(nextStats));
    if (nextTweaks) setTweaks({...TWEAK_DEFAULTS, ...nextTweaks});
    setScreen("home");
  };
  const saveSupabaseRuntimeConfig = (config) => {
    setSupabaseConfig(config);
    setSupabaseConfigState(config);
    setSyncStatus(config.url && config.anonKey ? "Supabase 설정 저장됨" : "로컬 저장 사용 중");
  };
  const guardedCloudPush = async (modeLabel="저장") => {
    if (!supabaseClient || !session?.user?.id) {
      setSyncStatus("로그인 후 클라우드 저장을 사용할 수 있어요.");
      setSyncState("error");
      return { ok:false };
    }
    const remote = await pullCloudSnapshot(supabaseClient, session.user.id);
    const remoteUpdatedAt = remote.data?.updated_at || null;
    if (remoteUpdatedAt) setLastRemoteUpdatedAt(remoteUpdatedAt);
    if (remoteUpdatedAt && lastSyncedAt && remoteUpdatedAt > lastSyncedAt) {
      setHasSyncConflict(true);
      setSyncStatus("다른 기기에서 더 최근 저장이 있어요. 먼저 클라우드에서 불러오기를 눌러 주세요.");
      setSyncState("error");
      return { ok:false, conflict:true };
    }
    const pushed = await pushCloudSnapshot(supabaseClient, session.user.id, stats, tweaks);
    if (pushed.error) {
      setSyncStatus(`${modeLabel} 실패: ${pushed.error.message}`);
      setSyncState("error");
      return { ok:false };
    }
    const stamp = pushed.data?.updated_at || new Date().toISOString();
    setLastSyncedAt(stamp);
    setLastRemoteUpdatedAt(stamp);
    setHasSyncConflict(false);
    setSyncStatus(`${modeLabel} 완료`);
    setSyncState("synced");
    return { ok:true };
  };
  const pushNow = async () => {
    if (!supabaseClient || !session?.user?.id) {
      setSyncStatus("로그인 후 클라우드 저장을 사용할 수 있어요.");
      setSyncState("error");
      return;
    }
    setSyncStatus("클라우드 저장 중...");
    setSyncState("syncing");
    await guardedCloudPush("수동 저장");
  };
  const pullNow = async () => {
    if (!supabaseClient || !session?.user?.id) {
      setSyncStatus("로그인 후 클라우드 불러오기를 사용할 수 있어요.");
      setSyncState("error");
      return;
    }
    setSyncStatus("클라우드 데이터 확인 중...");
    setSyncState("syncing");
    const { data, error } = await pullCloudSnapshot(supabaseClient, session.user.id);
    if (error) {
      setSyncStatus(`클라우드 불러오기 실패: ${error.message}`);
      setSyncState("error");
      return;
    }
    if (!data?.data?.studyState) {
      setSyncStatus("클라우드에 저장된 데이터가 없어요. 현재 로컬 데이터를 기준으로 시작합니다.");
      setSyncState("ready");
      setHasSyncConflict(false);
      return;
    }
    setStats(hydrateStats(data.data.studyState));
    suppressNextAutoSyncRef.current = true;
    if (data.data.tweaks) setTweaks({...TWEAK_DEFAULTS, ...data.data.tweaks});
    setSyncStatus("클라우드 데이터 불러오기 완료");
    setSyncState("synced");
    setLastSyncedAt(data.updated_at || new Date().toISOString());
    setLastRemoteUpdatedAt(data.updated_at || new Date().toISOString());
    setHasSyncConflict(false);
  };
  const signOutCloud = async () => {
    if (!supabaseClient) return;
    await supabaseClient.auth.signOut();
    setSession(null);
    bootstrappedUserRef.current = null;
    setSyncStatus("로그아웃됨");
    setSyncState("ready");
    setLastSyncedAt(null);
    setLastRemoteUpdatedAt(null);
    setHasSyncConflict(false);
  };
  React.useEffect(() => {
    if (!supabaseClient || !session?.user?.id) return;
    if (suppressNextAutoSyncRef.current) {
      suppressNextAutoSyncRef.current = false;
      return;
    }
    setSyncStatus("변경사항 감지됨 - 자동 저장 대기 중");
    setSyncState("dirty");
    if (autoSyncTimerRef.current) clearTimeout(autoSyncTimerRef.current);
    autoSyncTimerRef.current = setTimeout(async () => {
      setSyncStatus("자동 동기화 중...");
      setSyncState("syncing");
      await guardedCloudPush("자동 동기화");
    }, 900);
    return () => {
      if (autoSyncTimerRef.current) clearTimeout(autoSyncTimerRef.current);
    };
  }, [stats, tweaks, session?.user?.id, supabaseClient]);

  const reviewCount = getDueReviewWords(stats).length;
  const archiveScreens = ARCHIVE_TOOLS.map(item => item.id);
  const activeNav = archiveScreens.includes(screen) ? "archive" : screen;
  const goNav = (id) => {
    if (id === "archive") {
      setHubOpen(v => !v);
      if (!hubOpen && !archiveScreens.includes(screen)) setScreen("vocab");
      return;
    }
    setHubOpen(false);
    setScreen(id);
  };
  const handleStartScene = React.useCallback(() => setScreen("scene"), []);

  const handleLogin = React.useCallback(async (username, pin, mode) => {
    if (!supabaseClient) return { error: "Supabase 연결 오류예요." };
    const fakeEmail = usernameToFakeEmail(username);
    const password = await derivePinPassword(fakeEmail, pin);
    if (mode === "signup") {
      const { data, error } = await supabaseClient.auth.signUp({
        email: fakeEmail, password,
        options: {
          emailRedirectTo: window.location.origin + window.location.pathname,
          data: { display_name: username }
        }
      });
      if (error) return { error: "계정 만들기 실패: " + error.message };
      if (!data.session) return { error: "계정이 만들어졌어요. 이제 로그인해 주세요." };
    } else {
      const { error } = await supabaseClient.auth.signInWithPassword({ email: fakeEmail, password });
      if (error) return { error: "사용자 이름이나 PIN이 틀렸어요." };
    }
    setScreen("home");
    return { ok: true };
  }, [supabaseClient]);

  const handleLogout = async () => {
    if (supabaseClient) await supabaseClient.auth.signOut();
    setSession(null);
    bootstrappedUserRef.current = null;
    setStats(hydrateStats(makeDefaultStats()));
    setTweaks({...TWEAK_DEFAULTS});
    setScreen("home");
  };

  if (sessionLoading) {
    return (
      <div style={{position:"fixed",inset:0,display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)"}}>
        <div style={{fontFamily:"var(--font-brush)",fontSize:40,color:"var(--sub2)",animation:"blink 1.4s ease-in-out infinite"}}>靜習</div>
      </div>
    );
  }
  if (!session) {
    return <LoginScreen onLogin={handleLogin} />;
  }

  return (
    <div className="app">
      {/* Sidebar */}
      <nav className="sidebar">
        <div className="logo">
          <div className="logo-badge">靜</div>
          <div style={{marginLeft:8}}>
            <div className="logo-name">靜習</div>
            <div className="logo-sub">중국어 수련장</div>
          </div>
        </div>
        <div style={{flex:1, overflowY:"auto", marginRight:-4, paddingRight:4}}>
          {NAV.map(n => (
            <div key={n.id} className={`nav-item${activeNav===n.id?" active":""}`}
              onClick={()=>goNav(n.id)}>
              <span className="icon">{n.icon}</span>
              <span>{n.label}</span>
              {n.id==="archive" && reviewCount>0 &&
                <span className="nav-badge">{reviewCount}</span>}
            </div>
          ))}
        </div>
        <div style={{paddingTop:16, borderTop:"1px solid var(--border)"}}>
          <div className="nav-item" onClick={()=>setTweaksOpen(o=>!o)}>
            <span className="icon">⚙️</span>
            <span style={{fontSize:12}}>테마 설정</span>
          </div>
        </div>
      </nav>

      {/* Main content */}
      <main className="main" key={screen}>
        {screen==="home"   && (
          <HomeScreen
            stats={stats}
            onStartScene={handleStartScene}
            onReview={()=>setScreen("review")}
            session={session}
            syncStatus={syncStatus}
            syncState={syncState}
            onToggleWordFavorite={handleToggleWordFavorite}
          />
        )}
        {screen==="scene"  && <SceneScreen stats={stats} onResult={handleResult}/>}
        {screen==="study"  && <StudyScreen chapter={activeChapter||getStudyChapters(stats)[0]} stats={stats} onResult={handleResult} onBack={()=>setScreen("home")} onToggleWordFavorite={handleToggleWordFavorite}/>}
        {screen==="mission" && <MissionScreen stats={stats} onCompleteMission={handleMissionComplete}/>}
        {screen==="vocab"  && <VocabScreen stats={stats} onStudyChapter={handleStudyChapter} onToggleWordFavorite={handleToggleWordFavorite} onAddUserWord={handleAddUserWord}/>}
        {screen==="phrase" && <PhraseScreen stats={stats} onTogglePhraseFavorite={handleTogglePhraseFavorite} onToggleWordFavorite={handleToggleWordFavorite}/>}
        {screen==="grammar" && <GrammarScreen/>}
        {screen==="commute" && <CommuteScreen stats={stats}/>}
        {screen==="review" && <ReviewScreen stats={stats} onResult={handleResult} onBack={()=>setScreen("home")}/>}
        {screen==="chat"   && <ChatScreen/>}
        {screen==="stats"  && <StatsScreen stats={stats}/>}
        {screen==="inspect" && (
          <InspectScreen
            supabaseClient={supabaseClient}
            supabaseConfig={supabaseConfig}
          />
        )}
        {screen==="backup" && (
          <BackupScreen
            stats={stats}
            tweaks={tweaks}
            onImport={handleImport}
            session={session}
            syncStatus={syncStatus}
            syncState={syncState}
            lastSyncedAt={lastSyncedAt}
            hasSyncConflict={hasSyncConflict}
            onSignOut={handleLogout}
            onPullCloud={pullNow}
            onPushCloud={pushNow}
          />
        )}
      </main>

      {hubOpen && (
        <div className="hub-sheet">
          <div className="hub-head">
            <div className="hub-title">Archive Tools</div>
            <button onClick={()=>setHubOpen(false)} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,color:"var(--sub)"}}>✕</button>
          </div>
          <div className="hub-grid">
            {ARCHIVE_TOOLS.map(tool => (
              <button key={tool.id} className="hub-tool" onClick={()=>{ setScreen(tool.id); setHubOpen(false); }}>
                <span className="icon">{tool.icon}</span>
                <span className="label">{tool.label}</span>
                <span className="desc">{tool.desc}</span>
              </button>
            ))}
          </div>
        </div>
      )}

      {/* Bottom nav (zen hub) */}
      <nav className="bnav">
        <div className="bnav-inner">
          {NAV.map(n => (
            <div key={n.id} className={`bnav-item${activeNav===n.id?" active":""}`}
              onClick={()=>goNav(n.id)}>
              <span className="icon">{n.icon}</span>
              <span>{n.label}</span>
              <span className="sub">{n.sub}</span>
              {n.id==="archive" && reviewCount>0 &&
                <span className="bnav-badge">{reviewCount}</span>}
            </div>
          ))}
        </div>
      </nav>

      {/* Tweaks panel */}
      <div className={`tweaks${tweaksOpen?" open":""}`}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div className="tw-title" style={{margin:0}}>테마 설정</div>
          <button onClick={()=>setTweaksOpen(false)} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,color:"var(--sub)"}}>✕</button>
        </div>

        <div className="tw-label">포인트 색상</div>
        <div className="tw-row">
          {[["blue","코발트"],["indigo","인디고"],["sky","스카이"],["periwinkle","페리윙클"]].map(([k,l])=>(
            <button key={k} className={`tw-chip${tweaks.accent===k?" on":""}`}
              onClick={()=>applyTweak("accent",k)}>{l}</button>
          ))}
        </div>

        <div className="tw-label">한자 폰트</div>
        <div className="tw-row">
          {[["serif","명조체"],["sans","고딕체"]].map(([k,l])=>(
            <button key={k} className={`tw-chip${tweaks.zhFont===k?" on":""}`}
              onClick={()=>applyTweak("zhFont",k)}>{l}</button>
          ))}
        </div>

        <div className="tw-label">학습 데이터 초기화</div>
        <div className="tw-row">
          <button className="tw-chip" style={{color:"var(--coral)",borderColor:"var(--coral)55"}}
            onClick={()=>{
              if(!confirm("정말 초기화할까요?")) return;
              const fresh = makeDefaultStats();
              setStats(fresh);
              setTweaksOpen(false);
            }}>데이터 초기화</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
